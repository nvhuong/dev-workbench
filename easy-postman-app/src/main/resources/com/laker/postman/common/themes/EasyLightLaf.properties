#========================================
# Cài đặt chung của thành phần
#========================================
# Kích thước phi lê
Component.arc=12
Component.accentColor=@accentColor
Component.focusColor=@accentColor
Component.focusedBorderColor=@accentColor
Component.focusWidth=0
Component.innerFocusWidth=0
Component.innerOutlineWidth=0
# Kiểu mũi tên: .chevron（Vhình mũi tên).triangle（tam giác).arrow（mũi tên rắn)
Component.arrowType=chevron
#========================================
# Kiểu nút
#========================================
Button.arc=8
Button.borderWidth=1
Button.innerFocusWidth=0
Button.margin=4,12,4,12
Button.background=@surface
Button.foreground=$EasyPostman.text.primary
Button.disabledBackground=$EasyPostman.button.disabled.background
Button.disabledText=$EasyPostman.text.disabled
Button.borderColor=@borderColor
Button.hoverBorderColor=tint(@accentColor,45%)
Button.pressedBorderColor=tint(@accentColor,25%)
Button.focusedBorderColor=@accentColor
Button.focusedBackground=null
Button.hoverBackground=@buttonHoverBg
Button.pressedBackground=@buttonPressedBg
Button.default.background=@accentButtonDefaultBackground
Button.default.foreground=contrast($Button.default.background, tint($Button.foreground,50%), #fff, 50%)
Button.default.focusedBackground=null
Button.default.borderColor=shade($Button.default.background,15%)
Button.default.hoverBorderColor=tint($Button.default.background,50%)
Button.default.focusedBorderColor=$Button.default.hoverBorderColor
Button.default.boldText=true
Button.default.borderWidth=1
[style]Button.easyPostmanPrimary=arc: 8; borderWidth: 1; focusWidth: 0; innerFocusWidth: 0; margin: 4,12,4,12; background: $EasyPostman.color.primary; foreground: $EasyPostman.text.inverse; hoverBackground: $EasyPostman.color.primary.light; pressedBackground: $EasyPostman.color.primary.darker; focusedBackground: null; disabledBackground: $EasyPostman.button.disabled.background; disabledText: $EasyPostman.text.disabled; borderColor: $EasyPostman.color.primary.dark; hoverBorderColor: $EasyPostman.color.primary.light; pressedBorderColor: $EasyPostman.color.primary.darker; focusedBorderColor: $EasyPostman.color.primary.light
[style]Button.easyPostmanSecondary=arc: 8; borderWidth: 1; focusWidth: 0; innerFocusWidth: 0; margin: 4,12,4,12; background: @surface; foreground: $EasyPostman.text.primary; hoverBackground: @buttonHoverBg; pressedBackground: @buttonPressedBg; focusedBackground: null; disabledBackground: $EasyPostman.button.disabled.background; disabledText: $EasyPostman.text.disabled; borderColor: @borderColor; hoverBorderColor: tint(@accentColor,45%); pressedBorderColor: tint(@accentColor,25%); focusedBorderColor: @accentColor
[style]ToggleButton.easyPostmanToggle=arc: 8; borderWidth: 1; focusWidth: 0; innerFocusWidth: 0; margin: 4,12,4,12; background: @surface; foreground: $EasyPostman.text.primary; hoverBackground: @buttonHoverBg; pressedBackground: @buttonPressedBg; selectedBackground: $EasyPostman.color.primary; selectedForeground: $EasyPostman.text.inverse; disabledBackground: $EasyPostman.button.disabled.background; disabledText: $EasyPostman.text.disabled; borderColor: @borderColor; hoverBorderColor: tint(@accentColor,45%); pressedBorderColor: tint(@accentColor,25%); selectedBorderColor: $EasyPostman.color.primary.dark
#========================================
# Chuyển đổi kiểu nút (Toggle Button）
#========================================
# ToggleButton Trạng thái không được chọn
ToggleButton.background=#f5f5f5
ToggleButton.foreground=#505050
ToggleButton.borderColor=#d0d0d0
# ToggleButton Trạng thái đã chọn (nền xanh trong)
ToggleButton.selectedBackground=@accentColor
ToggleButton.selectedForeground=#ffffff
ToggleButton.selectedBorderColor=darken(@accentColor,10%)
# ToggleButton Trạng thái di chuột
ToggleButton.hoverBackground=@buttonHoverBg
ToggleButton.hoverBorderColor=#b0b0b0
# ToggleButton Trạng thái ép
ToggleButton.pressedBackground=@buttonPressedBg
ToggleButton.pressedBorderColor=#a0a0a0
# ToggleButton Trạng thái khuyết tật
ToggleButton.disabledBackground=#f0f0f0
ToggleButton.disabledForeground=#c0c0c0
ToggleButton.disabledBorderColor=#e0e0e0
# ToggleButton Kiểu thanh công cụ (phẳng)
ToggleButton.toolbar.hoverBackground=@buttonHoverBg
ToggleButton.toolbar.pressedBackground=@buttonPressedBg
ToggleButton.toolbar.selectedBackground=@accentColor
ToggleButton.toolbar.selectedForeground=#ffffff
