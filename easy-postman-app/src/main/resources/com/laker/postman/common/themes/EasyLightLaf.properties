#========================================
# Màu nền của bảng điều khiển và vùng chứa
#========================================
Panel.background=@panelBg
ToolBar.background=@surface
ScrollPane.background=@surface
ScrollPane.border=1,1,1,1,@borderColor
SplitPane.background=@panelBg
Label.background=@panelBg
Label.disabledBackground=@panelBg
#========================================
# Phong cách bảng chia
#========================================
SplitPane.dividerSize=3
SplitPane.dividerFocusColor=@dividerFocusColor
SplitPaneDivider.background=@dividerBg
SplitPaneDivider.border=1,0,1,0,@dividerBorderColor
#========================================
# Phong cách đối thoại
#========================================
Dialog.background=@dialogChromeBg
OptionPane.background=@dialogChromeBg
OptionPane.buttonArea.background=@dialogChromeBg
OptionPane.messageArea.background=@dialogChromeBg
#========================================
# Phong cách thực đơn
#========================================
MenuBar.background=@menuBg
Menu.background=@menuBg
Menu.selectionBackground=@tableSelectionBg
Menu.selectionForeground=@accentColor
MenuItem.background=@menuBg
MenuItem.selectionBackground=@tableSelectionBg
MenuItem.selectionForeground=@accentColor
RadioButtonMenuItem.background=@menuBg
RadioButtonMenuItem.selectionBackground=@tableSelectionBg
RadioButtonMenuItem.selectionForeground=@accentColor
CheckBoxMenuItem.background=@menuBg
CheckBoxMenuItem.selectionBackground=@tableSelectionBg
CheckBoxMenuItem.selectionForeground=@accentColor
#========================================
# Kiểu bàn
#========================================
# --- Màu cơ bản ---
# Màu nền của bảng
Table.background=@surface
# --- trạng thái đã chọn ---
# Màu nền của hàng đã chọn (trạng thái hoạt động - Bảng có tiêu điểm)
Table.selectionBackground=@tableSelectionBg
# Màu văn bản hàng đã chọn
Table.selectionForeground=#1a1a1a
# Màu nền của hàng đã chọn (trạng thái không hoạt động - Bảng mất tiêu điểm)
Table.selectionInactiveBackground=lighten(@tableSelectionBg,8%)
# Màu văn bản hàng đã chọn (không hoạt động)
Table.selectionInactiveForeground=#555555
# --- các đường lưới ---
# Màu đường lưới (xám mềm)
Table.gridColor=@tableGridColor
# Có hiển thị đường lưới ngang hay không
Table.showHorizontalLines=true
# Có hiển thị đường lưới dọc hay không
Table.showVerticalLines=true
# Có hiển thị đường thẳng đứng của cột cuối cùng hay không
Table.showTrailingVerticalLine=true
# --- biên giới ---
# Đường viền bảng (trên cùng,Bên trái,Xuống,Đúng,màu)
Table.border=1,1,1,1,@tableBorderColor,2,2,2,2
# --- Kéo tay cầm ---
# Màu mặc định của tay cầm kéo
Table.dragHandleColor=@dragHandleColor
# Kéo tay cầm để chọn/Kích hoạt màu sắc
Table.dragHandleActiveColor=@dragHandleActiveColor
# --- Phong cách tế bào ---
# Phần đệm tế bào (top,Bên trái,Xuống,đúng)- Hãy để nội dung thở
Table.cellMargins=4,8,4,8
# khoảng cách ô (chiều rộng,chiều cao)
Table.intercellSpacing=0,0
# Chiều cao hàng (pixel)- Chiều cao hàng thoải mái hơn
Table.rowHeight=28
# --- Kiểm tra tối ưu hóa hiệu suất ---
# Phần đệm của vùng được chọn (top,Bên trái,Xuống,đúng)- Làm cho vùng được chọn thu nhỏ lại
Table.selectionInsets=2,4,2,4
# Bán kính góc của vùng được chọn - Hiệu ứng lựa chọn góc tròn hiện đại
Table.selectionArc=8
# --- Tập trung tế bào ---
# Màu đường viền của tiêu điểm ô
Table.cellFocusColor=@accentColor
# Có luôn hiển thị chỉ báo tiêu điểm ô (false Cho biết rằng nó sẽ chỉ được hiển thị trong một số điều kiện nhất định)
Table.showCellFocusIndicator=false
# --- Hiệu ứng kéo ---
# Nó hoạt động khi kéo/Màu sắc của các đường giữa các cột
Table.dropLineColor=@accentColor
# Màu của các đường ngắn giữa các ô khi kéo
Table.dropLineShortColor=darken(@accentColor,15%)
# Kéo màu nền của ô mục tiêu
Table.dropCellBackground=fade(@accentColor,20%)
# --- Các cài đặt khác ---
# Vẽ các hàng xen kẽ bên dưới bảng (khi bảng nhỏ hơn bảng cuộn)
Table.paintOutsideAlternateRows=true
# Nhấn F2 Chọn tất cả văn bản khi bắt đầu chỉnh sửa
Table.editorSelectAllOnStartEditing=true
# Home/End Hành vi chính và List và Tree Hãy nhất quán
Table.consistentHomeEndKeyBehavior=true
#========================================
# Kiểu tiêu đề (thiết kế phẳng)
#========================================
# --- Màu cơ bản ---
# Màu nền tiêu đề
TableHeader.background=@tableHeaderBg
# --- Kích thước tiêu đề ---
# Chiều cao đầu
TableHeader.height=32
# Phần đệm ô tiêu đề (top,Bên trái,Xuống,đúng)
TableHeader.cellMargins=5,10,5,10
# --- Hiệu ứng tương tác (yếu, giữ nguyên) ---
# Màu nền khi di chuột qua
TableHeader.hoverBackground=#f3f6fa
# Màu nền khi nhấn
TableHeader.pressedBackground=#edf2f7
# --- Dải phân cách (rất mỏng, độ tương phản thấp) ---
# Màu sắc của dải phân cách dọc giữa các ô tiêu đề (rất nhạt)
TableHeader.separatorColor=@tableGridColor
# Màu sắc của đường phân chia ở cuối tiêu đề (dùng để phân biệt tiêu đề và nội dung)
TableHeader.bottomSeparatorColor=@tableGridColor
# Có hiển thị đường phân cách dọc của cột cuối cùng hay không
TableHeader.showTrailingVerticalLine=false
# --- Tế bào tập trung ---
# Màu nền của ô tiêu điểm
TableHeader.focusCellBackground=@tableHeaderBg
#========================================
# Phong cách danh sách
#========================================
List.background=@surface
List.selectionBackground=@tableSelectionBg
# Kéo màu đường (màu xanh lam, dễ nhìn hơn)
List.dropLineColor=@accentColor
# Lớp phủ mờ khi kéo
List.dropCellBackground=#e0f0ff
List.dropCellForeground=@accentColor
#========================================
# Phong cách điều khiển cây
#========================================
Tree.background=@surface
Tree.selectionBackground=@tableSelectionBg
Tree.selectionForeground=#000000
Tree.selectionBorderColor=#b0d0f0
Tree.selectionInactiveBackground=#e0e0e0
Tree.selectionInactiveForeground=#000000
# Kéo màu đường (màu xanh lam, dễ nhìn hơn)
Tree.dropLineColor=@accentColor
# Lớp phủ mờ khi kéo
Tree.dropCellBackground=#e0f0ff
Tree.dropCellForeground=@accentColor
# Màu nền của nút cây di chuột
Tree.hoverBackground=@buttonHoverBg
Tree.hoverInactiveBackground=#f0f0f0
# Chiều cao hàng nút cây
Tree.rowHeight=28
# Thụt lề nút cây
Tree.leftChildIndent=8
Tree.rightChildIndent=12
# Khoảng cách biểu tượng nút cây
Tree.iconTextGap=6
#========================================
# Phong cách bảng điều khiển tab
#========================================
TabbedPane.arc=10
TabbedPane.tabAreaArc=10
TabbedPane.tabArc=10
TabbedPane.background=@tabBg
TabbedPane.tabAreaBackground=@tabBg
TabbedPane.contentAreaColor=@tabSeparatorColor
TabbedPane.selectedBackground=@tabSelectedBg
TabbedPane.hoverColor=@tabHoverBg
TabbedPane.tabSeparatorColor=@tabSeparatorColor
TabbedPane.showTabSeparators=false
TabbedPane.contentSeparatorHeight=1
# Hủy bỏ nút cuộn, chiến lược hiển thị nút cuộn
