# ============================================================
# Easy Postman Tệp cấu hình chủ đề tùy chỉnh
# ============================================================
# Mô tả:
#  - Tập tin này sẽ được áp dụng EasyLightLaf Chủ đề được tải tự động
#  - Tệp cấu hình phải cùng với lớp chủ đề EasyLightLaf.java dưới cùng một đường dẫn gói
#  - Cấu hình ở đây sẽ bị ghi đè FlatLightLaf cài đặt mặc định
#
# Định cấu hình thứ tự tải (những thứ được tải sau sẽ ghi đè lên những thứ được tải trước):
#  1. FlatLaf.properties       (FlatLaf Cấu hình cơ bản)
#  2. FlatLightLaf.properties  (Cấu hình theme nhẹ,EasyLightLaf Kế thừa từ FlatLightLaf)
#  3. EasyLightLaf.properties  (Tập tin này, cấu hình tùy chỉnh)
#
# tham khảo:https://www.formdev.com/flatlaf/how-to-customize/
# ============================================================
#========================================
# Định nghĩa biến màu
#========================================
# Màu nền của bảng điều khiển (IDEA-like workspace gray）
@panelBg=#e9eaee
# thẻ/Màu nền của vùng chỉnh sửa
@surface=#ffffff
# Màu nền của trình đơn
# Cửa sổ trên cùng chrome Màu nền (MenuBar với nội tuyến TitlePane được chia sẻ, bằng với nền bên ngoài)
@windowChromeBg=@panelBg
# Dialog chrome Màu nền (chỉ dành cho  JDialog Thanh tiêu đề, hình nền và footer）
@dialogChromeBg=#f7f8f9
# Màu nền của trình đơn
@menuBg=@windowChromeBg
# Chọn màu nền
@selectionBg=#d4e3ff
# Tab Màu nền vùng (IDEA-like: Nền trắng không được chọn)
@tabBg=#ffffff
# Tab Chọn màu nền (IDEA Islands Light）
@tabSelectedBg=#e2ebfe
# Tab Màu nền di chuột
@tabHoverBg=#f2f6ff
# Tab Đường phân chia ở dưới cùng của khu vực
@tabSeparatorColor=#e9eaee
# Màu nhấn (màu xanh chủ đề)
@accentColor=#3771e1
# Bảng màu nền được chọn
@tableSelectionBg=#d4e3ff
# Màu đường lưới của bảng
@tableGridColor=#e8ebef
# Màu nền của tiêu đề bảng
@tableHeaderBg=#f4f6f8
# Màu đường viền bảng
@tableBorderColor=#e8ebef
# Màu tay cầm kéo (trạng thái mặc định)
@dragHandleColor=#646464
# Màu tay cầm kéo (đã chọn/trạng thái di chuột)
@dragHandleActiveColor=#3c3c3c
# Màu viền
@borderColor=#d3dae6
# Màu tiêu điểm của dòng phân chia
@dividerFocusColor=#a0a4aa
# Màu nền của đường phân chia
@dividerBg=@panelBg
# Màu đường viền phân chia
@dividerBorderColor=#d5d8de
# Màu nền của nút di chuột
@buttonHoverBg=#eff4ff
# Màu nền nhấn nút
@buttonPressedBg=#dce9ff
# Màu thanh trượt thanh cuộn
# Màu biểu đồ kiểm tra hiệu suất
@performanceChartGridColor=#dcdcdc
@performanceChartCurveColor=#2979ff
@performanceChartAxisColor=#646464
@performanceChartTextColor=#505050
@performanceChartQpsLine=#16a34a
@performanceChartResponseTimeLine=#d97706
@performanceChartMatchedLine=#0284c7
@performanceChartDurationLine=#06b6d4
@performanceChartErrorRateLine=#db5860
# Màu báo cáo hiệu suất
@performanceReportTotalFg=#0066cc
@performanceReportTotalBg=#e6f0ff
@performanceReportSuccessColor=#009900
@performanceReportWarningColor=#3399ff
@performanceReportErrorColor=#db5860
# Màu bảng kết quả hiệu suất
@performanceResultTableGridColor=#e6e6e6
@performanceResultSuccessForeground=#16a34a
@performanceResultWarningForeground=#d97706
@performanceResultFailureForeground=#db5860
@performanceResultMutedForeground=#64748b
@performanceResultSuccessStripe=#16a34a
@performanceResultFailureStripe=#f1abaa
@scrollbarThumb=#c8ccd4
# Màu di chuột của thanh trượt thanh cuộn
@scrollbarThumbHover=#b7bdc8
# Màu theo dõi thanh cuộn
@scrollbarTrack=#f3f4f7
# Màu nền trước của dấu phân cách
@separatorFg=#d5d8de
# Màu nền phân cách
@separatorBg=#f0f0f0
# FlatLaf Ghi đè biến tích hợp
# Màu nhấn Màu tiêu điểm
@accentFocusColor=@accentColor
# Màu nền nút mặc định
@accentButtonDefaultBackground=if(@accentColor, @accentColor, tint(@accentBaseColor,15%))
