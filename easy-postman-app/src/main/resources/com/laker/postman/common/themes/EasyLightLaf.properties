CheckBox.icon.style=
CheckBox.icon.focusWidth=1
#========================================
# Kiểu nút radio
#========================================
# Sử dụng các kiểu đường viền
# LƯU Ý: Phải được đặt rõ ràng thành null, nếu không nó sẽ được kế thừa FlatLightLaf.properties trong filled phong cách
RadioButton.icon.style=
#========================================
# Phong cách thành phần văn bản
#========================================
