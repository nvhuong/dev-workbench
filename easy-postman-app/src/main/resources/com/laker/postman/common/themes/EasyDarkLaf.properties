ScrollBar.thumbHover=@scrollbarThumbHover
ScrollBar.track=@scrollbarTrack
#========================================
# Phong cách chia
#========================================
# Màu nền của bảng phân chia
SplitPane.background=@panelBg
# Kích thước đường phân chia (chiều rộng)
SplitPane.dividerSize=1
# Màu tiêu điểm của dòng phân chia (khi di chuột)
SplitPane.dividerFocusColor=@dividerFocusColor
# Kiểu chia: .grip（cái kẹp).plain（phẳng)
SplitPaneDivider.style=plain
# Màu nền phân chia
SplitPaneDivider.background=@dividerBg
# Đường viền ngăn cách: đường viền trên cùng1px，Xung quanh0px，Đường viền dưới1px，Màu sắc là dividerBorderColor
SplitPaneDivider.border=0,0,0,0,@dividerBorderColor
# Số lượng điểm kẹp
SplitPaneDivider.gripDotCount=5
# Kích thước điểm kẹp
SplitPaneDivider.gripDotSize=3
# Màu điểm kẹp (trạng thái mặc định - Các chủ đề tối sử dụng màu xám nhạt hơn một chút)
SplitPaneDivider.gripColor=#555960
# Đánh dấu màu khi kéo (chủ đề tối - gợi ý rõ ràng hơn)
SplitPaneDivider.draggingColor=#4c5057
