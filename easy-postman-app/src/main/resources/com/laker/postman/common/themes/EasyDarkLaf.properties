#========================================
# Cài đặt chung của thành phần
#========================================
# Kích thước phi lê
Component.arc=8
Component.foreground=@textPrimary
Component.accentColor=@accentColor
Component.focusColor=@accentColor
Component.focusedBorderColor=@accentColor
Component.borderColor=@borderColor
Component.hoverBorderColor=#3a3d42
Component.disabledBorderColor=#2b2d30
Component.focusWidth=0
Component.innerFocusWidth=0
Component.innerOutlineWidth=0
