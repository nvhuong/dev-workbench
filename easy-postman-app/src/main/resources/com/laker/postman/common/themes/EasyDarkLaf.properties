TitlePane.buttonHoverBackground=@buttonHoverBg
TitlePane.buttonPressedBackground=@buttonPressedBg
#========================================
# Phong cách đối thoại
#========================================
Dialog.background=@dialogChromeBg
OptionPane.background=@dialogChromeBg
OptionPane.buttonArea.background=@dialogChromeBg
OptionPane.messageArea.background=@dialogChromeBg
#========================================
# Phong cách chú giải công cụ
#========================================
#========================================
# Phong cách thanh tiến trình
#========================================
ProgressBar.arc=10
#========================================
# Phong cách phân cách
#========================================
# Màu nền trước của dấu phân cách (chủ đề tối - màu xám nhạt hơn một chút)
Separator.foreground=@separatorFg
# Màu nền phân cách (chủ đề tối - gần với nền chính)
Separator.background=@separatorBg
#========================================
# Phong cách bảng điều khiển
#========================================
# Màu nền của bảng điều khiển và vùng chứa
Panel.background=@panelBg
ToolBar.background=@surface
ScrollPane.background=@surface
ScrollPane.border=1,1,1,1,@borderColor
Label.background=@panelBg
Label.foreground=@textPrimary
Label.disabledForeground=@textDisabled
Label.disabledBackground=@panelBg
#========================================
# Kiểm tra hiệu suất màu sắc tùy chỉnh
#========================================
# Màu biểu đồ nhóm chủ đề
Performance.chart.gridColor=@performanceChartGridColor
Performance.chart.curveColor=@performanceChartCurveColor
Performance.chart.axisColor=@performanceChartAxisColor
Performance.chart.textColor=@performanceChartTextColor
Performance.chart.threadsLine=@performanceChartCurveColor
Performance.chart.qpsLine=@performanceChartQpsLine
Performance.chart.responseTimeLine=@performanceChartResponseTimeLine
Performance.chart.matchedLine=@performanceChartMatchedLine
Performance.chart.durationLine=@performanceChartDurationLine
Performance.chart.errorRateLine=@performanceChartErrorRateLine
# Màu báo cáo hiệu suất
Performance.report.totalForeground=@performanceReportTotalFg
Performance.report.totalBackground=@performanceReportTotalBg
Performance.report.successColor=@performanceReportSuccessColor
Performance.report.warningColor=@performanceReportWarningColor
Performance.report.errorColor=@performanceReportErrorColor
# Màu bảng kết quả hiệu suất
Performance.result.gridColor=@performanceResultTableGridColor
Performance.result.successForeground=@performanceResultSuccessForeground
Performance.result.warningForeground=@performanceResultWarningForeground
Performance.result.failureForeground=@performanceResultFailureForeground
Performance.result.mutedForeground=@performanceResultMutedForeground
Performance.result.successStripe=@performanceResultSuccessStripe
Performance.result.failureStripe=@performanceResultFailureStripe
