# ============================================================
# Easy Postman Hồ sơ chủ đề tối tùy chỉnh
# ============================================================
# Mô tả:
#  - Tập tin này sẽ được áp dụng EasyDarkLaf Chủ đề được tải tự động
#  - Tệp cấu hình phải cùng với lớp chủ đề EasyDarkLaf.java dưới cùng một đường dẫn gói
#  - Cấu hình ở đây sẽ bị ghi đè FlatDarkLaf cài đặt mặc định
#
# Định cấu hình thứ tự tải (những thứ được tải sau sẽ ghi đè lên những thứ được tải trước):
#  1. FlatLaf.properties       (FlatLaf Cấu hình cơ bản)
#  2. FlatDarkLaf.properties   (Cấu hình chủ đề tối,EasyDarkLaf Kế thừa từ FlatDarkLaf)
#  3. EasyDarkLaf.properties   (Tập tin này, cấu hình tùy chỉnh)
#
# tham khảo:https://www.formdev.com/flatlaf/how-to-customize/
# ============================================================
#========================================
# Định nghĩa biến màu (chủ đề tối)
#========================================
# Màu nền của bảng điều khiển (IDEA-like dark workspace chrome / outer boundary）
@panelBg=#26282c
# thẻ/Màu nền của vùng nội dung (IDEA-like inner surface）
@surface=#1e1f22
# Nền nội dung của các cửa sổ công cụ không thể chỉnh sửa như cây và danh sách được thống nhất với vùng nội dung
@toolWindowBg=@surface
# Nhập/Màu nền của tiêu đề (sáng hơn một chút so với vùng nội dung để tránh điều khiển quá nặng)
@inputBg=#2b2d30
# Cấp độ văn bản tiền cảnh
@textPrimary=#c9ccd3
@textSecondary=#b9bdc5
@textHint=#7b8089
@textDisabled=#565b64
# Cửa sổ trên cùng chrome Màu nền (MenuBar với nội tuyến TitlePane được chia sẻ, bằng với nền bên ngoài)
@windowChromeBg=@panelBg
# Dialog chrome Màu nền (chỉ dành cho  JDialog Thanh tiêu đề, hình nền và footer）
@dialogChromeBg=#1e1f22
# Màu nền của thanh menu (chủ đề tối - với cửa sổ chrome nhất quán)
@menuBg=@windowChromeBg
# Chọn màu nền
@selectionBg=#2b4371
# Màu nền lựa chọn không hoạt động
@inactiveSelectionBg=#303338
# Tab Màu nền vùng (IDEA-like: Khu vực chỉnh sửa vừa vặn không được chọn)
@tabBg=@surface
# Tab Chọn màu nền (sáng hơn một chút so với vùng chỉnh sửa màu tối)
@tabSelectedBg=#2b2d30
# Tab Màu nền di chuột
@tabHoverBg=@panelBg
# Tab Đường phân chia ở dưới cùng của khu vực
@tabSeparatorColor=#2b2d30
# Màu nhấn (màu xanh chủ đề)
@accentColor=#3574f0
# Màu trạng thái (IDEA-like: Độ bão hòa thấp ở màu tối để tránh lấn át thông tin cấu trúc)
@statusSuccess=#57965c
@statusSuccessDark=#4e8f55
@statusError=#db5860
@statusErrorDark=#c75450
@statusErrorDarker=#a64545
@statusWarning=#c29e49
@statusWarningDark=#a8873f
@statusWarningDarker=#8a6d32
@statusInfo=#4faed0
# Màu nền của nút di chuột
@buttonHoverBg=#2b2d30
# Màu nền nhấn nút
@buttonPressedBg=#24262a
# Màu tiêu điểm phân chia (chủ đề tối - Màu nhấn khi di chuột)
@dividerFocusColor=#3a3d42
# Màu nền phân chia (chủ đề tối - gần với nền chính)
@dividerBg=@surface
# Màu đường viền phân chia (chủ đề tối - đường phân chia tinh tế)
@dividerBorderColor=#2b2d30
# Màu viền (chủ đề tối)
@borderColor=#323438
# Bảng đã chọn màu nền (chủ đề tối)
@tableSelectionBg=@selectionBg
# Màu đường lưới của bảng (chủ đề tối)
@tableGridColor=#2b2d30
# Màu đường viền bảng (chủ đề tối)
@tableBorderColor=#2b2d30
# Màu nền của tiêu đề bảng
@tableHeaderBg=@inputBg
# Màu tay cầm kéo (trạng thái mặc định - chủ đề tối)
@dragHandleColor=#9b9b9b
# Màu tay cầm kéo (đã chọn/Trạng thái di chuột - chủ đề tối)
@dragHandleActiveColor=#c8c8c8
# Màu biểu đồ kiểm tra hiệu suất (chủ đề tối)
@performanceChartGridColor=#303338
@performanceChartCurveColor=@accentColor
@performanceChartAxisColor=#62666e
@performanceChartTextColor=@textSecondary
@performanceChartQpsLine=@statusSuccessDark
@performanceChartResponseTimeLine=@statusWarningDark
@performanceChartMatchedLine=@statusInfo
@performanceChartDurationLine=@statusInfo
@performanceChartErrorRateLine=@statusErrorDark
# Màu báo cáo hiệu suất (chủ đề tối)
@performanceReportTotalFg=#8ab4df
@performanceReportTotalBg=#263244
@performanceReportSuccessColor=@statusSuccess
@performanceReportWarningColor=@statusWarning
@performanceReportErrorColor=@statusError
# Màu bảng kết quả hiệu suất (chủ đề tối)
@performanceResultTableGridColor=@tableGridColor
@performanceResultSuccessForeground=@statusSuccessDark
@performanceResultWarningForeground=@statusWarningDark
@performanceResultFailureForeground=@statusErrorDark
@performanceResultMutedForeground=@textHint
@performanceResultSuccessStripe=@statusSuccessDark
@performanceResultFailureStripe=@statusErrorDarker
# Màu thanh trượt thanh cuộn
@scrollbarThumb=#3f4248
# Màu di chuột của thanh trượt thanh cuộn
@scrollbarThumbHover=#4c5057
# Màu theo dõi thanh cuộn
@scrollbarTrack=@surface
# Màu nền trước của dấu phân cách
@separatorFg=#2b2d30
# Màu nền phân cách
@separatorBg=@surface
# FlatLaf Ghi đè biến tích hợp
@accentFocusColor=@accentColor
@accentButtonDefaultBackground=if(@accentColor, @accentColor, tint(@accentBaseColor,15%))
