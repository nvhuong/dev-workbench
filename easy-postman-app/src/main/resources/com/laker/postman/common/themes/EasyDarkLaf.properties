[style]ToggleButton.easyPostmanToggle=arc: 8; borderWidth: 1; focusWidth: 0; innerFocusWidth: 0; margin: 4,12,4,12; background: @surface; foreground: @textPrimary; hoverBackground: @buttonHoverBg; pressedBackground: @buttonPressedBg; selectedBackground: $EasyPostman.color.primary; selectedForeground: $EasyPostman.text.inverse; disabledBackground: $EasyPostman.button.disabled.background; disabledText: @textDisabled; borderColor: @borderColor; hoverBorderColor: tint(@accentColor,35%); pressedBorderColor: tint(@accentColor,20%); selectedBorderColor: $EasyPostman.color.primary.light
