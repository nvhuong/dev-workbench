toolbox.capture.manual_trust.title=Cài root CA
toolbox.capture.manual_trust.guide=DevWorkbench không tự đặt CA thành tin cậy được.\n\nCách làm thủ công trên macOS:\n\n1. Trong Keychain Access, nhập/mở chứng chỉ bên dưới.\n2. Nếu macOS hỏi, nên thêm vào keychain System.\n3. Mở mục chứng chỉ, mở rộng phần Trust và đặt:\n   Secure Sockets Layer (SSL) -> Always Trust\n4. Đóng hộp thoại và nhập mật khẩu macOS nếu được hỏi.\n5. Khởi động lại hoàn toàn trình duyệt rồi thử lại HTTPS.\n\nĐường dẫn chứng chỉ:\n{0}\n\nTrạng thái tin cậy hiện tại:\n{1}
toolbox.capture.manual_trust.guide.windows=DevWorkbench không tự đặt CA thành tin cậy được.\n\nCách làm thủ công trên Windows:\n\n1. Mở chứng chỉ bên dưới.\n2. Bấm Install Certificate.\n3. Chọn Current User.\n4. Chọn Place all certificates in the following store.\n5. Chọn Trusted Root Certification Authorities.\n6. Hoàn tất trình hướng dẫn, xác nhận cảnh báo bảo mật rồi khởi động lại trình duyệt.\n\nĐường dẫn chứng chỉ:\n{0}\n\nTrạng thái tin cậy hiện tại:\n{1}
