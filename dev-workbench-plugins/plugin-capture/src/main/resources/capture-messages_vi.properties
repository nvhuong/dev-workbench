toolbox.capture.tls.diagnosis.title=Chẩn đoán capture TLS
toolbox.capture.tls.diagnosis.body=Capture HTTPS thất bại với host {0}. Nguyên nhân thường gặp: certificate pinning, ứng dụng chưa tin cậy CA của DevWorkbench, kho chứng chỉ riêng, hoặc client đóng kết nối. Hãy chuột phải vào host này và chọn "Bỏ qua host này"; nếu cần xem dữ liệu đã giải mã, hãy kiểm tra hệ thống/ứng dụng đã tin cậy root CA của DevWorkbench. Lỗi gốc: {1}
toolbox.capture.idle_details=Proxy capture đang nghỉ.\n\nHỗ trợ:\n- Proxy HTTP tường minh\n- HTTPS CONNECT + MITM\n- Nâng cấp WebSocket và xem trước frame\n- Xem trước response dạng luồng SSE\n- Header request / response\n- Xem trước body, thời gian và kích thước\n
