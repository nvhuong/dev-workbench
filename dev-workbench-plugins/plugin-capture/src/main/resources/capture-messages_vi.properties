toolbox.capture.https_decrypt.hint.enabled=Root CA đã được tin cậy nên các kết nối HTTPS mới có thể được giải mã. Ứng dụng dùng certificate pinning hoặc kho tin cậy riêng vẫn có thể từ chối bị chặn.
toolbox.capture.https_decrypt.hint.disabled=Proxy hệ thống vẫn ghi được đích CONNECT của HTTPS và các kết nối đang mở, nhưng muốn giải mã request/response HTTPS mới thì cần root CA được tin cậy. Sau khi gỡ CA, hãy khởi động lại ứng dụng nguồn để đóng các phiên TLS cũ.
toolbox.capture.https_decrypt.hint.verify=Root CA đã được cài nhưng chưa được tin cậy. HTTPS có thể vẫn chỉ ghi được metadata cho đến khi hệ thống xác nhận tin cậy và ứng dụng nguồn được khởi động lại.
