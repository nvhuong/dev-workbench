cert.help.content=Chứng chỉ ứng dụng khách được sử dụng để xác thực mTLS (TLS lẫn nhau). \n\nCác định dạng chứng chỉ được hỗ trợ:\n- PFX/P12: một tệp chứa chứng chỉ và khóa riêng\n- PEM: tệp chứng chỉ riêng và tệp khóa riêng\n\nKhớp tên máy chủ:\n- Khớp chính xác: api.example.com\n- Khớp ký tự đại diện: *.example.com\n\nCấu hình cổng:\n- 0 có nghĩa là khớp với tất cả các cổng\n- Số cổng được chỉ định chỉ khớp với các cổng cụ thể\n\nƯu tiên: chứng chỉ kích hoạt khớp đầu tiên sẽ được sử dụng. .
