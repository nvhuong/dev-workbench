cert.help.content=Chứng chỉ client dùng cho xác thực mTLS.\n\nĐịnh dạng chứng chỉ được hỗ trợ:\n- PFX/P12: một file chứa cả chứng chỉ và khóa riêng\n- PEM: file chứng chỉ và file khóa riêng tách rời\n\nKhớp host:\n- Khớp chính xác: api.example.com\n- Khớp wildcard: *.example.com\n\nKhớp cổng:\n- 0 khớp mọi cổng\n- Một cổng cụ thể chỉ khớp đúng cổng đó\n\nThứ tự ưu tiên: dùng chứng chỉ đang bật đầu tiên khớp.
