toolbox.capture.manual_trust.title=Cài đặt CA gốc
toolbox.capture.manual_trust.guide=EasyPostman không thể tự động đặt CA này là đáng tin cậy. \n\nTrong macOS, bạn có thể làm theo các bước bên dưới để xử lý thủ công:\n\n1. Nhập hoặc mở chứng chỉ sau trong "Truy cập chuỗi khóa". \n2. Nếu được macOS yêu cầu, trước tiên hãy thêm nó vào móc khóa "Hệ thống". \n3. Mở mục nhập chứng chỉ, mở rộng Tin cậy và đặt:\n Lớp cổng bảo mật (SSL) -> Luôn tin cậy\n4. Đóng hộp thoại và nhập mật khẩu macOS của bạn khi được nhắc. \n5. Sau khi khởi động lại hoàn toàn trình duyệt, hãy kiểm tra lại HTTPS. \n\nĐường dẫn chứng chỉ:\n{0}\n\nTrạng thái tin cậy hiện tại:\n{1}
toolbox.capture.manual_trust.guide.windows=EasyPostman không thể tự động đặt CA này là đáng tin cậy. \n\nTrong Windows, bạn có thể xử lý thủ công như sau:\n\n1. Mở tệp chứng chỉ bên dưới. \n2. Nhấp vào "Cài đặt chứng chỉ". \n3. Chọn "Người dùng hiện tại". \n4. Chọn "Đặt tất cả chứng chỉ vào cửa hàng sau". \n5. Chọn Cơ quan chứng nhận gốc đáng tin cậy. \n6. Hoàn tất trình hướng dẫn, xác nhận lời nhắc bảo mật và khởi động lại trình duyệt. \n\nĐường dẫn chứng chỉ:\n{0}\n\nTrạng thái tin cậy hiện tại:\n{1}
