toolbox.capture.empty.stopped_history=Tác nhân chụp gói đã bị dừng nhưng vẫn có thể xem các yêu cầu lịch sử. Chọn một yêu cầu để xem chi tiết hoặc khởi động lại proxy để tiếp tục thu thập các gói. .
toolbox.capture.empty.view_filter_no_match=Hiện tại không có bản ghi phù hợp trong bộ lọc hiển thị. \n\nBạn có thể tắt các bộ lọc hiển thị chẳng hạn như "Ngoại lệ/Yêu cầu chậm/Ẩn tĩnh/Ẩn điểm chôn/Nhật ký/API chỉ xem" hoặc điều chỉnh các điều kiện tìm kiếm ở trên. .
