toolbox.capture.https_decrypt.hint.enabled=CA gốc được tin cậy và các kết nối HTTPS mới có thể được giải mã. Các ứng dụng sử dụng tính năng ghim chứng chỉ hoặc kho lưu trữ chứng chỉ độc lập vẫn có thể bị từ chối thu thập thông tin. .
toolbox.capture.https_decrypt.hint.disabled=Proxy hệ thống vẫn có thể ghi lại các điểm đến HTTPS CONNECT và các kết nối đã thiết lập, nhưng việc giải mã yêu cầu/phản hồi HTTPS mới yêu cầu CA gốc đáng tin cậy. Sau khi gỡ cài đặt CA, vui lòng khởi động lại ứng dụng nguồn và đóng phiên TLS cũ. .
toolbox.capture.https_decrypt.hint.verify=CA gốc đã được cài đặt nhưng độ tin cậy chưa có hiệu lực, HTTPS có thể vẫn chỉ nhìn thấy siêu dữ liệu. Vui lòng xác nhận độ tin cậy của hệ thống và khởi động lại ứng dụng nguồn. .
