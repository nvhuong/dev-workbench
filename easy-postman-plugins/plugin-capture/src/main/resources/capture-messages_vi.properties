toolbox.capture.tls.client_rejected=Máy khách đã từ chối chứng chỉ HTTPS do EasyPostman tạo cho {0}. Nguyên nhân phổ biến là ứng dụng/trang web sử dụng tính năng ghim chứng chỉ hoặc kho chứng chỉ độc lập. Bạn nên nhấp chuột phải vào máy chủ và chọn "Loại trừ máy chủ này (kết nối trực tiếp)". Lỗi gốc: {1}
toolbox.capture.tls.client_handshake_failed=Máy khách đã đóng kết nối hoặc từ chối chứng chỉ trong quá trình bắt tay MITM TLS cho {0}. Nếu cùng một máy chủ xuất hiện nhiều lần, bạn nên nhấp chuột phải vào máy chủ đó và chọn "Loại trừ máy chủ này (kết nối trực tiếp)". Lỗi gốc: {1}
toolbox.capture.tls.diagnosis.title=Chẩn đoán thu thập thông tin TLS
toolbox.capture.tls.diagnosis.body=Việc thu thập thông tin HTTPS của máy chủ {0} không thành công, thường là do chứng chỉ đang được ghim, ứng dụng không tin cậy EasyPostman CA, ứng dụng sử dụng kho chứng chỉ độc lập hoặc máy khách chủ động đóng kết nối. Nên nhấp chuột phải vào máy chủ và chọn "Loại trừ máy chủ này (kết nối trực tiếp)"; nếu bạn thực sự cần giải mã, hãy xác nhận rằng hệ thống/ứng dụng tin cậy CA gốc EasyPostman. Lỗi gốc: {1}
toolbox.capture.idle_details=Tác nhân chụp gói hiện không chạy. \n\nHiện được hỗ trợ:\n- Proxy rõ ràng HTTP\n- HTTPS CONNECT + MITM\n- Xem trước khung và nâng cấp WebSocket\n- Xem trước phản hồi phát trực tuyến SSE\n- Tiêu đề yêu cầu/phản hồi\n- Xem trước nội dung, mức tiêu thụ thời gian và kích thước\n
toolbox.capture.empty.running=Tác nhân chụp gói đang chạy. \n\nChọn yêu cầu để xem chi tiết; nếu danh sách trống, vui lòng xác nhận rằng tác nhân hệ thống đã được đồng bộ hóa, ứng dụng đích đang chạy 127.0.0.1:8888 hoặc điều chỉnh bộ lọc chụp gói. .
