performance.remote.workers.tooltip=Máy chủ lưu trữ được phân tách bằng dấu phẩy hoặc khoảng trắng: cổng. Số lượng người dùng ảo GUI là tổng số đồng thời toàn cầu, sẽ được chia sẻ giữa các công nhân; các hàng CSV dựa trên phạm vi người dùng ảo toàn cầu. Các tham chiếu tệp cục bộ sẽ không được tải lên và phải được đặt trước trên máy chủ công nhân dọc theo cùng một đường dẫn.
