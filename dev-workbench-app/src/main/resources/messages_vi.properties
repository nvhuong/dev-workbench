memory_tuning.title=Hướng dẫn thiết lập bộ nhớ
memory_tuning.content=Gói cài đặt Dev Workbench mặc định giới hạn heap Java ở mức 1 GB. Kiểm thử tải với nhiều luồng đồng thời, tắt chế độ rút gọn chi tiết, giữ quá nhiều lỗi hoặc xem trước phản hồi lớn có thể gây lỗi Java heap space.
memory_tuning.when.title=Khi cần điều chỉnh
memory_tuning.when.body=Gói cài đặt Dev Workbench mặc định giới hạn heap Java ở mức 1 GB. Kiểm thử tải với nhiều luồng đồng thời, tắt chế độ rút gọn chi tiết, giữ quá nhiều lỗi hoặc xem trước phản hồi lớn có thể gây lỗi Java heap space. Nên giảm lượng lưu giữ kết quả trước; nếu vẫn chưa đủ thì tăng -Xmx và khởi động lại.
memory_tuning.recommended.title=Cài đặt được đề xuất để kiểm tra căng thẳng
memory_tuning.recommend.compact.title=Hãy ngắn gọn và chi tiết
memory_tuning.recommend.compact.desc=Nên bật nó lên. Ở chế độ đơn giản hóa, theo mặc định, bảng kết quả chỉ giữ lại 1.000 mục nhập gần đây nhất, giúp quá trình kiểm tra sức chịu đựng dài hạn ổn định hơn.
memory_tuning.recommend.preview.title=Xem trước nội dung phản hồi
memory_tuning.recommend.preview.desc=Nên điều chỉnh nó thành 2KB-4KB. Các bảng kết quả WebSocket/SSE thường chỉ yêu cầu bản xem trước tin nhắn cuối cùng và không phù hợp để giữ lại nội dung lớn hoàn chỉnh.
memory_tuning.recommend.row_limit.title=Giới hạn trên của bảng kết quả
memory_tuning.recommend.row_limit.desc=Khi tắt tính năng sắp xếp hợp lý các chi tiết, nhiều chi tiết khác sẽ vẫn được giữ lại nhưng chúng sẽ bị cắt bớt theo "Cài đặt -> Kiểm tra mức độ căng thẳng -> Giới hạn trên về lưu giữ bảng kết quả" và mặc định là {0}.
memory_tuning.recommend.failure.title=Chi tiết hàng lỗi
memory_tuning.recommend.failure.desc=Các hàng không thành công chỉ giữ lại lỗi, mã trạng thái, số lần gửi/nhận/khớp và xem trước tin nhắn cuối cùng, không nên giữ lại toàn bộ nội dung 64KB cho mỗi hàng.
memory_tuning.xmx.title=Cách tăng -Xmx
memory_tuning.platform.mac.desc=Nhấp chuột phải vào DevWorkbench.app -> Hiển thị nội dung gói, chỉnh sửa Nội dung/app/DevWorkbench.cfg và thay đổi -Xmx1g thành -Xmx2g hoặc -Xmx4g.
memory_tuning.platform.windows_installer=Phiên bản cài đặt Windows
memory_tuning.platform.windows_installer.desc=Nhập thư mục cài đặt, thường là C:\\Program Files\\DevWorkbench, chỉnh sửa app\\DevWorkbench.cfg và thay đổi -Xmx1g thành -Xmx2g hoặc -Xmx4g. Nếu bạn không có quyền, vui lòng chỉnh sửa với quyền quản trị viên.
memory_tuning.platform.windows_portable=Phiên bản di động của Windows
memory_tuning.platform.windows_portable.desc=Nhập thư mục giải nén DevWorkbench\\app, chỉnh sửa DevWorkbench.cfg và thay đổi -Xmx1g thành -Xmx2g hoặc -Xmx4g.
memory_tuning.platform.linux.desc=Nhập thư mục cài đặt, thường là /opt/devworkbench/lib/app hoặc /opt/DevWorkbench/lib/app, chỉnh sửa DevWorkbench.cfg và thay đổi -Xmx1g thành -Xmx2g hoặc -Xmx4g.
memory_tuning.platform.jar=Chạy bình trực tiếp
memory_tuning.platform.jar.desc=Chỉ định khi bắt đầu: java -Xms256m -Xmx2g -jar dev-workbench.jar
memory_tuning.xmx.note=Lưu ý: Ứng dụng phải được khởi động lại sau khi sửa đổi. Không đặt -Xmx gần hoặc vượt quá bộ nhớ khả dụng của máy; thường bắt đầu với 2g, sau đó sử dụng 4g khi cần lớn hơn và máy có đủ bộ nhớ.
