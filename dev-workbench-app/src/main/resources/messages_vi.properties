settings.request.editor_tabs.description=Kiểm soát tab nào được hiển thị ở đầu trình chỉnh sửa yêu cầu. Việc ẩn tab chỉ ảnh hưởng đến hiển thị giao diện và không xóa dữ liệu yêu cầu đã lưu.
settings.request.editor_tabs.tooltip=Tab sẽ không được hiển thị sau khi đóng; dữ liệu hiện có vẫn sẽ được giữ lại và tham gia vào các yêu cầu.
settings.request.script.title=Đã tải tập lệnh
settings.request.script.description=Kiểm soát cách require() trong tập lệnh tải JavaScript bên ngoài. Các thư viện tích hợp luôn có sẵn; chỉ các tập lệnh tùy chỉnh cục bộ/từ xa bị ảnh hưởng ở đây.
settings.request.script.remote_require_enabled=Cho phép tải tập lệnh từ mạng
settings.request.script.remote_require_enabled.tooltip=Sau khi bật nó, require('https://...') trong tập lệnh sẽ tải xuống và thực thi JavaScript từ xa. Nó bị tắt theo mặc định.
settings.request.script.remote_require_allow_http=Cho phép tập lệnh từ xa HTTP
settings.request.script.remote_require_allow_http.tooltip=Chỉ dành cho gỡ lỗi cục bộ. Khi được bật, http:// được phép sử dụng để tải các tập lệnh từ xa, điều này gây ra rủi ro bảo mật rõ ràng.
settings.request.script.remote_require_allowed_hosts=Danh sách trắng máy chủ tập lệnh từ xa:
settings.request.script.remote_require_allowed_hosts.tooltip=Tùy chọn. Nhiều máy chủ được phân tách bằng dấu phẩy, chẳng hạn như cdn.example.com,static.example.com. Để trống để không hạn chế chủ nhà.
settings.request.script.remote_require.connect_timeout=Hết thời gian kết nối tập lệnh từ xa (ms):
settings.request.script.remote_require.connect_timeout.tooltip=Thời gian chờ tối đa để thiết lập kết nối khi tải tập lệnh từ xa phải lớn hơn 0.
settings.request.script.remote_require.read_timeout=Thời gian chờ đọc tập lệnh từ xa (ms):
settings.request.script.remote_require.read_timeout.tooltip=Thời gian chờ tối đa để đọc nội dung phản hồi khi tải tập lệnh từ xa phải lớn hơn 0.
settings.request.script.remote_require.max_size=Kích thước tập lệnh từ xa tối đa (KB):
settings.request.script.remote_require.max_size.tooltip=Kích thước tối đa được phép tải xuống bởi một tập lệnh từ xa duy nhất phải lớn hơn 0. Quá trình tải sẽ bị từ chối nếu vượt quá.
# Phần cài đặt hiệu suất
settings.performance.title=Kiểm tra căng thẳng
settings.performance.max_idle=Số lượng kết nối nhàn rỗi tối đa:
settings.performance.max_idle.tooltip=Số lượng kết nối nhàn rỗi tối đa được nhóm kết nối OkHttp giữ lại, không phải giới hạn trên của các kết nối đang được triển khai. Mặc định là 100.
settings.performance.keep_alive=Thời gian duy trì kết nối (giây):
settings.performance.keep_alive.tooltip=Thời gian duy trì kết nối tối đa, tính bằng giây
settings.performance.max_requests=Số lượng yêu cầu đồng thời tối đa:
settings.performance.max_requests.tooltip=Giới hạn trên của tính đồng thời toàn cầu của Bộ điều phối không đồng bộ OkHttp; kiểm tra căng thẳng HTTP thông thường hiện sử dụng thực thi đồng bộ và không bị giới hạn bởi giá trị này.
settings.performance.max_requests_per_host=Số lượng đồng thời tối đa trên một máy chủ:
settings.performance.max_requests_per_host.tooltip=Giới hạn trên của tính đồng thời của Bộ điều phối không đồng bộ OkHttp cho cùng một máy chủ; kiểm tra căng thẳng HTTP thông thường hiện sử dụng thực thi đồng bộ và không tuân theo giá trị này.
settings.performance.js_context_pool_size=Kích thước nhóm bối cảnh JS:
settings.performance.js_context_pool_size.tooltip=Số lượng bối cảnh GraalJS tối đa mà tập lệnh kiểm tra sức chịu đựng có thể thực thi đồng thời. Nên bắt đầu với số lượng lõi CPU gấp 4 lần. Tập lệnh gửi trước WebSocket có tính đồng thời cao có thể được tăng lên một cách thích hợp.
settings.performance.js_context_acquire_timeout=Bối cảnh JS có thời gian chờ (ms):
settings.performance.js_context_acquire_timeout.tooltip=Thời gian tối đa mà luồng thực thi tập lệnh chờ một Bối cảnh JS nhàn rỗi. Nó có thể được tăng lên khi tính đồng thời cao hoặc tập lệnh chạy chậm để tránh tình trạng xếp hàng ngắn hạn và lỗi trực tiếp.
settings.performance.slow_request_threshold=Ngưỡng yêu cầu chậm (ms, 0=bị tắt):
settings.performance.slow_request_threshold.tooltip=Khi bật chi tiết tinh giản, các yêu cầu mất nhiều thời gian hơn ngưỡng này sẽ được ghi vào bảng kết quả (0 có nghĩa là bị vô hiệu hóa và chỉ những yêu cầu không thành công mới được ghi lại)
settings.performance.response_body_preview_limit=Giới hạn xem trước nội dung phản hồi (KB):
settings.performance.response_body_preview_limit.tooltip=Kích thước xem trước nội dung phản hồi HTTP được giữ lại trong chi tiết kết quả kiểm tra căng thẳng cũng được sử dụng để xem trước thông báo WebSocket/SSE khi bật chi tiết hợp lý. Mặc định là 64KB. Chỉ ảnh hưởng đến việc hiển thị kết quả và mức sử dụng bộ nhớ: các xác nhận, trích xuất JSONPath và tập lệnh hậu kỳ đều dựa trên nội dung phản hồi hoàn chỉnh (tối đa 8MB mỗi lần và tùy thuộc vào kích thước tải xuống tối đa), sau đó được cắt bớt và giữ lại. Sử dụng cùng một giá trị cho GUI, CLI và các nhân viên phân tán.
settings.performance.result_row_limit=Giới hạn trên lưu giữ bảng kết quả (tắt chi tiết rút gọn):
settings.performance.result_row_limit.tooltip=Số hàng gần đây tối đa được giữ lại trong bảng kết quả khi tắt tính năng tinh giản chi tiết. Giá trị mặc định là 3000. Khi bật chi tiết được sắp xếp hợp lý, 1.000 bản ghi gần đây nhất sẽ được giữ lại cố định để giảm mức sử dụng bộ nhớ trong quá trình kiểm tra căng thẳng dài hạn.
settings.performance.trend_sampling=Khoảng thời gian làm mới biểu đồ xu hướng (giây):
settings.performance.trend_sampling.tooltip=Kiểm soát tần suất của các điểm mới trong biểu đồ xu hướng và ảnh chụp nhanh xu hướng của nhân viên từ xa (1-60 giây) mà không thay đổi thời gian kiểm tra căng thẳng hoặc tầm cỡ thống kê cuối cùng.
settings.performance.event_logging=Kích hoạt ghi nhật ký sự kiện
settings.performance.event_logging.tooltip=Có ghi lại nhật ký sự kiện trong quá trình kiểm tra sức chịu đựng hay không. Cho phép xem lịch sử chi tiết nhưng sẽ ảnh hưởng đến hiệu suất (tắt theo mặc định)
# Cài đặt giao diện người dùng
settings.ui.title=Cài đặt giao diện
settings.ui.font_name=Phông chữ:
settings.ui.font_name.tooltip=Chọn font chữ giao diện (để trống để sử dụng font mặc định của hệ thống)
settings.ui.font_size=Cỡ chữ:
settings.ui.font_size.tooltip=Đặt kích thước phông chữ giao diện (10-24)
settings.ui.font.system_default=Mặc định hệ thống
settings.ui.font.preview=Xem trước phông chữ: ABCabc123 ký tự tiếng Trung:: => 😀 🚀 ✨
settings.ui.font.applied=Phông chữ đã được áp dụng. Một số giao diện có thể yêu cầu khởi động lại ứng dụng để có hiệu lực hoàn toàn.
settings.ui.font.restart_recommended=Bạn nên khởi động lại ứng dụng để đảm bảo rằng tất cả các thành phần giao diện đều sử dụng phông chữ mới.
settings.validation.font_size_error=Cỡ chữ phải nằm trong khoảng 10-24
settings.ui.font.status.system_default=Phông chữ mặc định của hệ thống sẽ quay về phông chữ nền tảng, phù hợp nhất để hiển thị tiếng Trung và biểu tượng cảm xúc.
settings.ui.font.status.full=Phông chữ này có thể hiển thị trực tiếp biểu tượng cảm xúc tiếng Anh, tiếng Trung và phổ biến.
settings.ui.font.status.no_emoji=Phông chữ này hỗ trợ tiếng Trung nhưng biểu tượng cảm xúc có thể dựa vào dự phòng của hệ thống và hiệu quả thực tế phụ thuộc vào hệ điều hành.
settings.ui.font.status.no_cjk=Phông chữ này không hỗ trợ văn bản giao diện tiếng Trung và tiếng Trung trong giao diện có thể được hiển thị dưới dạng hộp hoặc ký tự bị cắt xén.
settings.ui.font.unsupported_warning=Phông chữ đã chọn không hỗ trợ văn bản giao diện tiếng Trung và tiếng Trung trong giao diện có thể được hiển thị dưới dạng hộp hoặc ký tự bị cắt xén sau khi lưu
settings.ui.font.unsupported_chinese_error=Ngôn ngữ giao diện hiện tại là tiếng Trung Quốc. Vui lòng chọn font hỗ trợ tiếng Trung, hoặc chuyển sang giao diện tiếng Anh trước khi sử dụng font này.
settings.editor.title=Phông chữ soạn thảo
settings.editor.description=Phông chữ soạn thảo độc lập với phông chữ giao diện. Dự phòng ký tự bị thiếu chỉ ảnh hưởng đến trình chỉnh sửa mã; khi phông chữ chính bị thiếu ký tự, những người chỉnh sửa hỗ trợ bản vẽ dự phòng sẽ sử dụng phông chữ dự phòng ký tự bị thiếu để hiển thị các ký tự, ký hiệu hoặc biểu tượng cảm xúc tiếng Trung.
settings.editor.font_name=Phông chữ chính của trình soạn thảo:
settings.editor.font_name.tooltip=Chọn phông chữ chính được ưu tiên cho nội dung yêu cầu, nội dung phản hồi, tập lệnh và trình soạn thảo mã hộp công cụ
settings.editor.font_fallback_name=Phông chữ dự phòng cho các ký tự bị thiếu:
settings.editor.font_fallback_name.tooltip=Khi phông chữ chính thiếu tiếng Trung, ký hiệu hoặc biểu tượng cảm xúc, hãy sử dụng phông chữ này để điền vào các ký tự còn thiếu trong trình chỉnh sửa được hỗ trợ, chẳng hạn như nội dung phản hồi/JSON
settings.editor.font_size=Cỡ chữ của trình soạn thảo:
settings.editor.font_size.tooltip=Đặt kích thước phông chữ của trình soạn thảo mã (8-32)
settings.editor.font.default_resolved=Lựa chọn tự động ({0})
settings.editor.font.fallback_auto_resolved=Lựa chọn tự động ({0}, được khuyến nghị)
settings.editor.font.preview.tooltip.no_fallback=Phông chữ dự phòng cho các ký tự bị thiếu sẽ được chọn tự động; khi phông chữ chính thiếu ký tự tiếng Trung, ký hiệu hoặc biểu tượng cảm xúc, người chỉnh sửa được hỗ trợ sẽ sử dụng phông chữ dự phòng để điền vào.
settings.editor.font.preview.tooltip.with_fallback=Phông chữ dự phòng cho các ký tự bị thiếu đã được đặt: {0}. Các trình soạn thảo hỗ trợ nội dung phản hồi/JSON, v.v. sẽ sử dụng nó để vẽ văn bản khi thiếu phông chữ chính.
settings.validation.editor_font_size_error=Kích thước phông chữ của trình soạn thảo phải nằm trong khoảng từ 8 đến 32
