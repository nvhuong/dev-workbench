performance.csv_data_set.scope_note=Tập dữ liệu CSV này chỉ hoạt động trên Nhóm luồng mà nó thuộc về. Mỗi người dùng ảo được liên kết vào một hàng theo số lượng người dùng; Việc thực thi từ xa sẽ sử dụng khoảng thời gian người dùng ảo toàn cầu do chủ phân bổ để tìm nạp các hàng và sẽ không cho phép mỗi nhân viên khởi động lại từ hàng 0. Khi số lượng hàng không đủ, nó sẽ được tái chế.
performance.simple.node=Bộ điều khiển đơn giản
performance.loop.iterations=Số chu kỳ:
performance.condition.node=tình trạng
performance.condition.expression=sự biểu lộ:
performance.condition.description=Các nút con chỉ được thực thi nếu biểu thức có giá trị đúng. \nCác giá trị được hỗ trợ: {{variable}}, chuỗi trích dẫn, số, đúng/sai. \nCác toán tử được hỗ trợ: ==, !=, >, >=, <, <=, &&, ||, ! và dấu ngoặc. \nHàm hỗ trợ: defined('name') kiểm tra biến có tồn tại hay không. \nCác biến đến từ bối cảnh thực thi hiện tại, bao gồm các biến môi trường/toàn cục, dữ liệu lặp CSV và các biến được ghi bởi các yêu cầu hoặc tập lệnh trước đó. \nCác biểu thức trống hoặc các biểu thức không hợp lệ được coi là sai. \nVí dụ: {{status}} == 200, defined('token') && {{retry}} < 3
performance.while.expression=Điều kiện vòng lặp:
performance.while.interval=Khoảng thời gian lặp lại (ms):
performance.while.timeout=Thời gian chờ (ms):
performance.while.max_iterations=Số lần lặp tối đa:
performance.while.description=Kiểu JMeter While Controller: đánh giá biểu thức trước mỗi vòng. true có nghĩa là thực thi nút con và tiếp tục đến vòng tiếp theo; sai có nghĩa là thoát ra và không thực hiện vòng tiếp theo. \nKhoảng thời gian lặp lại, thời gian chờ và số lần lặp tối đa là giới hạn an toàn của Dev Workbench; khi không cần chờ tự động, khoảng thời gian lặp lại có thể được đặt thành 0. \nCú pháp biến nhất quán với bộ điều khiển có điều kiện và có thể đến từ trình trích xuất, tập lệnh, dữ liệu CSV, biến môi trường hoặc biến toàn cục. \nCác biểu thức trống hoặc các biểu thức không hợp lệ được coi là sai, do đó vòng lặp sẽ được thoát trực tiếp. \nVí dụ: {{retryCount}} < 3, {{status}} != 200, defined('token') && {{count}} < 10
performance.simple.description=Chỉ việc phân nhóm được thực hiện và số lần thực hiện không thay đổi. \nTốt cho việc sắp xếp các yêu cầu, bộ hẹn giờ, điều kiện, xác nhận, trình trích xuất hoặc các bước WebSocket. \nMỗi lần vùng chứa cha thực thi bộ điều khiển, các nút con sẽ được thực thi một lần theo thứ tự cây. \nBản thân Bộ điều khiển đơn giản không thêm tính năng chờ, thử lại, lựa chọn ngẫu nhiên hoặc phán đoán có điều kiện. \nCác bước Gửi/Đọc/Đóng WS có thể được nhóm lại trong các yêu cầu WebSocket, nhưng WS Connect vẫn phải được đặt ngay trong các yêu cầu WebSocket.
performance.once_only.description=Mỗi người dùng ảo chỉ thực thi một nút con một lần trong mỗi lần chạy. \nThích hợp để đăng nhập, nhận mã thông báo, yêu cầu làm nóng trước hoặc các hành động chuẩn bị khác không được lặp lại trong mỗi chu kỳ. \nNhiều lần lặp lại của cùng một người dùng ảo chỉ chia sẻ trạng thái một lần; nó được thiết lập lại khi bắt đầu một lần chạy mới. \nNó là bộ điều khiển phía yêu cầu: nó có thể chứa yêu cầu, bộ đếm thời gian, Đơn giản/Vòng lặp/Điều kiện và các nút phụ khác bên trong. \nKhông đặt trực tiếp bước WebSocket trần trụi; nếu hành động chuẩn bị yêu cầu lưu lượng truy cập WebSocket, vui lòng đặt yêu cầu WebSocket bên dưới hành động đó.
performance.timer.delay=Thời gian chờ (ms):
performance.timer.hint=Bộ đếm thời gian sẽ có hiệu lực trước khi mỗi bộ lấy mẫu trong phạm vi cây của nó được thực thi; bộ hẹn giờ trong các bước trong cảnh WebSocket sẽ vẫn được thực thi theo thứ tự cảnh.
