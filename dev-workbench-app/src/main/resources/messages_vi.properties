settings.proxy.auth_section.title=Chứng nhận của cơ quan
settings.proxy.auth_section.description=Chỉ được bật nếu máy chủ proxy yêu cầu xác thực Cơ bản. Chế độ cấu hình thủ công gửi thông tin xác thực trực tiếp đến tác nhân; chế độ phát hiện tự động chỉ gửi chúng khi tác nhân được phát hiện trả về các yêu cầu xác thực cơ bản. Mật khẩu tài khoản proxy trong cài đặt hệ thống sẽ không được đọc.
