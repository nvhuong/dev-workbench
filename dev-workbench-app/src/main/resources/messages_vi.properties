settings.webdav_sync.upload.confirm.title=Xác nhận tải lên WebDAV
settings.webdav_sync.upload.confirm.message={0}\n\nViệc tải lên sẽ ghi đè ảnh chụp nhanh WebDAV bằng dữ liệu cục bộ, bao gồm tất cả không gian làm việc và cấu hình dùng chung. Tiếp tục? .
settings.webdav_sync.restore.confirm.title=Xác nhận khôi phục từ WebDAV
settings.webdav_sync.restore.confirm.message={0}\n\nĐiều này sẽ ghi đè tất cả các không gian làm việc và cấu hình được chia sẻ trên máy này bằng ảnh chụp nhanh WebDAV. Trước khi khôi phục, một bản sao lưu cục bộ sẽ được tạo tự động và tính toàn vẹn của ảnh chụp nhanh sẽ được kiểm tra; dữ liệu cục bộ sẽ không bị ghi đè nếu xác minh không thành công. Tiếp tục? .
settings.request.trusted_material.title=Chứng chỉ đáng tin cậy
settings.request.trusted_material.description=Không bắt buộc. Sự tin cậy bổ sung bao gồm chứng chỉ gốc của công cụ chụp gói, CA riêng của doanh nghiệp hoặc kho tin cậy tùy chỉnh. Hỗ trợ các tệp chứng chỉ PEM/CRT/CER/DER, cũng như kho tin cậy JKS/P12/PFX. Cấu hình này sẽ có hiệu lực cùng với CA đáng tin cậy mặc định của hệ thống; nếu chỉ để gỡ lỗi tạm thời, bạn cũng có thể trực tiếp tắt xác minh SSL ở trên.
