settings.request.trusted_material.enabled.tooltip=Khi được bật, Dev Workbench sẽ tin cậy thêm vào tệp chứng chỉ hoặc kho tin cậy mà bạn chọn ngoài kho chứng chỉ mặc định của hệ thống
settings.request.trusted_material.hint=Các mục trong danh sách sẽ có hiệu lực cùng với kho chứng chỉ mặc định của hệ thống. Các tệp chứng chỉ thường không yêu cầu mật khẩu; JKS/P12/PFX yêu cầu mật khẩu tương ứng.
