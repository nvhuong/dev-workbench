performance.csv.usage_note=• Trong kiểm tra hiệu suất, Tập dữ liệu CSV sẽ bị ràng buộc bởi người dùng ảo: cùng một luồng luôn sử dụng cùng một hàng dữ liệu trong toàn bộ quá trình kiểm tra, thay vì chuyển sang hàng tiếp theo cho mỗi yêu cầu\n^ Khi thực thi từ xa, các công nhân sẽ được phân phối theo tổng số người dùng ảo được định cấu hình trong GUI và các hàng CSV cũng sẽ được phân phối theo khoảng thời gian người dùng ảo toàn cầu để tránh việc đọc lặp lại từ hàng 0 cho mỗi công nhân\n Nếu số lượng người dùng đồng thời lớn hơn CSV thì số lượng hàng sẽ được tái chế theo số lượng hàng, vì vậy hãy đảm bảo rằng số lượng hàng cho dữ liệu tài khoản không ít hơn số lượng người dùng đồng thời\n^ Tập dữ liệu CSV chỉ hoạt động trên Nhóm luồng nơi nó thuộc về; nhiều Nhóm chủ đề có thể gắn các tệp CSV khác nhau tương ứng
