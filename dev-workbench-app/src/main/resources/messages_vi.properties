performance.result.detail.compact.enabled=Chi tiết hợp lý đã được bật
performance.result.detail.compact.disable.warning=Bạn có chắc chắn muốn tắt chi tiết tóm tắt không? \n\nSau khi đóng, bảng kết quả sẽ giữ lại tất cả chi tiết yêu cầu và nội dung phản hồi HTTP sẽ được giữ lại đầy đủ nhất có thể. Kiểm tra căng thẳng dài hạn hoặc đồng thời cao sẽ làm tăng đáng kể việc sử dụng bộ nhớ. \n\nSố liệu thống kê báo cáo không bị ảnh hưởng bởi việc chuyển đổi này. Khi bật chi tiết tinh gọn thì tổng số, tỷ lệ thành công, QPS, P90/P95/P99 và các chỉ số khác vẫn sẽ được tính đầy đủ. \n\nBạn nên tiếp tục bật kiểm tra sức chịu đựng đồng thời cao. Bạn vẫn muốn đóng cửa phải không? .
performance.result.detail.compact.warning.title=Cảnh báo lưu giữ chi tiết
performance.result.detail.compact.warning.msg=Số lượng yêu cầu ước tính trong bài kiểm tra căng thẳng hiện tại là tương đối cao ({0}), nhưng chi tiết hợp lý hóa không được bật. \n\nKhi tắt tính năng chi tiết được sắp xếp hợp lý, tất cả chi tiết yêu cầu sẽ được ghi vào bảng kết quả và nội dung phản hồi sẽ được giữ lại nhiều nhất có thể, điều này có thể gây ra áp lực bộ nhớ đáng kể. \n\nSố liệu thống kê báo cáo sẽ không bị ảnh hưởng; sau khi bật chi tiết tinh gọn, tổng số, tỷ lệ thành công, QPS, P90/P95/P99 và các chỉ số khác vẫn được tính đầy đủ nhưng bảng kết quả chỉ giữ lại chi tiết các yêu cầu không thành công, yêu cầu chậm. \n\nBạn có muốn bật các chi tiết được sắp xếp hợp lý ngay bây giờ không? .
