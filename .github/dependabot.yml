# Dependabot tập tin cấu hình
#
# Dependabot Nó là gì? .
# - GitHub Công cụ cập nhật phần phụ thuộc tự động giúp đảm bảo các phần phụ thuộc của dự án được an toàn và kịp thời
# - Tự động phát hiện các phần phụ thuộc đã lỗi thời và các lỗ hổng bảo mật (tệp CVE）
# - Được tạo tự động Pull Request để cập nhật các phiên bản phụ thuộc
#
# Chức năng chính:
# 1. 🔒 Bảo vệ an ninh: kịp thời phát hiện và sửa chữa các lỗ hổng bảo mật trong các gói phụ thuộc
# 2. 📦 Quản lý phiên bản: Tự động cập nhật các phụ thuộc lên phiên bản mới nhất
# 3. ⏰ Tiết kiệm thời gian: Không cần kiểm tra và cập nhật các phần phụ thuộc theo cách thủ công
# 4. 📊 Truy xuất nguồn gốc: Đã qua PR Ghi nhật ký mọi cập nhật phụ thuộc
#
# Làm thế nào để kiểm tra? .
# - nhà kho Security -> Dependabot alerts：Xem cảnh báo lỗ hổng bảo mật
# - Pull requests：Xem Dependabot Đã tạo bản cập nhật PR

version: 2
updates:
  # Maven Cấu hình cập nhật phụ thuộc dự án
  - package-ecosystem: "maven"
    # Quét thư mục: thư mục gốc pom.xml
    directory: "/"
    # Tần suất cập nhật: Kiểm tra mỗi tuần một lần
    # Các giá trị tùy chọn: .daily(mỗi ngày)、weekly(hàng tuần)、monthly(mỗi tháng)
    schedule:
      interval: "weekly"
      # Tùy chọn: Chỉ định thời gian kiểm tra (UTC múi giờ)
      # day: "monday"
      # time: "02:00"

    # Dự trữ đủ năng lực để tránh những cái hiện có PR Dừng khám phá các bản cập nhật mới khi hàng đợi đã đầy
    open-pull-requests-limit: 5

    # Các loại phụ thuộc được phép cập nhật
    # - dependency-type: "all" Cho biết cập nhật tất cả các phần phụ thuộc (phụ thuộc trực tiếp và phụ thuộc gián tiếp)
    # - Các lựa chọn khác:production（sự phụ thuộc vào sản xuất).development（phụ thuộc phát triển)
    allow:
      - dependency-type: "all"

    # Tùy chọn: ý chí Dependabot PR Tự động được chỉ định cho người đánh giá cụ thể
    # reviewers:
    #   - "your-github-username"

    # vì Dependabot PR Tự động thêm thẻ để quản lý dễ dàng
    labels:
      - "dependencies"

    # Tùy chọn: Đặt tiền tố thông tin gửi để dễ nhận biết
    # commit-message:
    #   prefix: "chore"
    #   include: "scope"

    # Hợp nhất các bản phát hành nhỏ và bản cập nhật bản vá với rủi ro tương thích thấp hơn, giảm bớt PR tiếng ồn
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions Phụ thuộc vào cấu hình cập nhật
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

# Lưu ý:
# 1. Dependabot sẽ được xử lý tự động GitHub Advisory Sửa lỗi bảo mật trong cơ sở dữ liệu
# 2. Cần phải được kích hoạt trong cài đặt kho "Dependabot alerts" và "Dependabot security updates"
# 3. con đường:Settings -> Security -> Code security and analysis
# 4. Cập nhật bảo mật PR sẽ được đánh dấu là "security" ưu tiên
# 5. Cập nhật có thể được kích hoạt theo cách thủ công: at Insights -> Dependency graph -> Dependabot Bấm vào "Check for updates"
