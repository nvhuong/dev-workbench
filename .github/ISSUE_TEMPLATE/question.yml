name: ❓ Tư vấn thắc mắc | Question
description: Ask usage questions or get help | Ask a question or seek help
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 gợi ý | Tip

        **Đối với các câu hỏi chung, nên sử dụng nó trước [Bảng thảo luận](https://github.com/lakernote/easy-postman/discussions)**，Nhận phản hồi nhanh hơn và trợ giúp cộng đồng! .

        **For general questions, we recommend using [Discussions](https://github.com/lakernote/easy-postman/discussions)** for faster responses and community help!

        ---

        Câu hỏi được chào đón! Vui lòng xem xét trước khi gửi [FAQ](https://github.com/lakernote/easy-postman#-faq) và [Tài liệu](https://github.com/lakernote/easy-postman#readme)。
        Welcome! Before submitting, please check the [FAQ](https://github.com/lakernote/easy-postman#-faq) and [documentation](https://github.com/lakernote/easy-postman#readme).

  - type: checkboxes
    id: pre-check
    attributes:
      label: Kiểm tra trước | Pre-check
      options:
        - label: Tôi đã tìm kiếm [Issues](https://github.com/lakernote/easy-postman/issues) và [Discussions](https://github.com/lakernote/easy-postman/discussions) | I have searched Issues and Discussions
          required: true
        - label: Tôi đã đọc nó [FAQ](https://github.com/lakernote/easy-postman#-faq) | I have read the FAQ
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Hạng mục câu hỏi | Question Category
      options:
        - Cài đặt và khởi động | Installation and Startup
        - Cách sử dụng chức năng | Feature Usage
        - Quản lý không gian làm việc | Workspace Management
        - Git tích hợp | Git Integration
        - Kiểm tra hiệu suất | Performance Testing
        - Nhập và xuất dữ liệu | Data Import/Export
        - Viết kịch bản | Script Writing
        - các biến môi trường | Environment Variables
        - Kết nối mạng | Network Connection
        - khác | Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Mô tả vấn đề | Question Description
      description: Vui lòng mô tả chi tiết vấn đề của bạn | Please describe your question in detail
      placeholder: Tôi muốn biết làm thế nào... | I would like to know how to...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Thông tin liên quan | Context
      description: Cung cấp thông tin môi trường liên quan, số phiên bản, hệ điều hành, v.v | Provide relevant information like environment, version, OS, etc.
      placeholder: |
        - EasyPostman Phiên bản | Version:
        - hệ điều hành | OS:
        - Thông tin khác | Other info:

  - type: textarea
    id: tried
    attributes:
      label: Đã thử các phương pháp | What I've Tried
      description: Bạn đã thử những phương pháp nào? . | What have you already tried?
      placeholder: Tôi đã cố gắng... | I have tried...

  - type: textarea
    id: additional
    attributes:
      label: Thông tin bổ sung | Additional Information
      description: Các thông tin khác giúp chúng tôi trả lời câu hỏi của bạn | Any other information that helps us answer your question

