name: 🐛 Bug Báo cáo | Bug Report
description: Báo cáo một Bug Hãy giúp chúng tôi cải thiện | Report a bug to help us improve
title: "[Bug]: "
labels: ["bug", "Yêu cầu xác nhận | need-confirm"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã dành thời gian để điền vào đây Bug Báo cáo! .
        Thank you for taking the time to fill out this bug report!

  - type: checkboxes
    id: pre-check
    attributes:
      label: Kiểm tra trước | Pre-check
      description: Vui lòng xác nhận những điều sau trước khi gửi | Please confirm the following before submitting
      options:
        - label: Tôi đã tìm kiếm [Issues](https://github.com/nvhuong/dev-workbench/issues) và [Discussions](https://github.com/nvhuong/dev-workbench/discussions)，Không tìm thấy câu hỏi tương tự | I have searched Issues and Discussions and found no similar issues
          required: true
        - label: Tôi đã đọc nó [FAQ Tài liệu](https://github.com/nvhuong/dev-workbench#-faq) | I have read the FAQ documentation
          required: true

  - type: input
    id: version
    attributes:
      label: DevWorkbench Phiên bản | Version
      description: bạn sử dụng DevWorkbench phiên bản (xem trên trang Giới thiệu)| Your DevWorkbench version (check in About page)
      placeholder: Ví dụ | e.g. 3.1.5
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: hệ điều hành | Operating System
      description: hệ điều hành của bạn | Your operating system
      options:
        - Windows
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Các bản phân phối khác | Other distributions)
        - khác | Other
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Phiên bản | Java Version
      description: Nếu được sử dụng JAR Chạy đi, vui lòng cung cấp Java phiên bản (chạy `java -version`）| If running JAR, provide Java version (run `java -version`)
      placeholder: Ví dụ | e.g. Java 21.0.8

  - type: textarea
    id: description
    attributes:
      label: Mô tả vấn đề | Bug Description
      description: Mô tả rõ ràng và chính xác vấn đề gặp phải | A clear and concise description of the bug
      placeholder: Hãy cho chúng tôi biết chuyện gì đã xảy ra... | Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Các bước để tái tạo | Steps to Reproduce
      description: Làm thế nào để tái tạo vấn đề này? . | How to reproduce this bug?
      placeholder: |
        1. Mở '...' | Open '...'
        2. Bấm vào '...' | Click on '...'
        3. Di chuyển đến '...' | Scroll to '...'
        4. Xem lỗi | See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Hành vi dự kiến | Expected Behavior
      description: Bạn mong đợi điều gì sẽ xảy ra? . | What did you expect to happen?
      placeholder: Tôi mong đợi... | I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: hành vi thực tế | Actual Behavior
      description: Điều gì thực sự đã xảy ra? . | What actually happened?
      placeholder: Thực ra... | Actually...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: ảnh chụp màn hình | Screenshots
      description: Nếu có thể, vui lòng thêm ảnh chụp màn hình để giúp minh họa vấn đề | If applicable, add screenshots to help explain the problem
      placeholder: Kéo và thả hình ảnh vào đây | Drag and drop images here

  - type: textarea
    id: logs
    attributes:
      label: Nhật ký | Logs
      description: Nếu có nhật ký hoặc thông báo lỗi liên quan, vui lòng dán chúng vào đây | If there are relevant logs or error messages, paste them here
      placeholder: |
        Ghi lại nội dung... | Log content...
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: Mức độ nghiêm trọng | Severity
      description: Cái này Bug Nó ảnh hưởng đến bạn đến mức nào | How much does this bug affect you?
      options:
        - 🔴 nghiêm trọng - Ứng dụng gặp sự cố hoặc không thể sử dụng được | Critical - App crashes or unusable
        - 🟠 Cao - Các chức năng chính không có sẵn | High - Major feature not working
        - 🟡 ở giữa - Các tính năng bị hạn chế nhưng có sẵn các lựa chọn thay thế | Medium - Feature limited but workaround exists
        - 🟢 thấp - Vấn đề nhỏ, không ảnh hưởng đến việc sử dụng | Low - Minor issue, doesn't affect usage
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Thông tin bổ sung | Additional Context
      description: Thông tin khác để giúp giải quyết vấn đề | Any other information that might help
      placeholder: Ví dụ: cụ thể API Cấu hình, môi trường mạng, v.v | e.g. specific API config, network environment, etc.

  - type: checkboxes
    id: contribution
    attributes:
      label: Sẵn sàng đóng góp | Willingness to Contribute
      description: Bạn có sẵn sàng nộp không? PR để khắc phục vấn đề này? . | Are you willing to submit a PR to fix this issue?
      options:
        - label: Tôi sẵn sàng phục tùng PR để khắc phục vấn đề này | I'm willing to submit a PR to fix this issue

