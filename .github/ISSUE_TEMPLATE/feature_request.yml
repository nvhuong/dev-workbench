name: ✨ Yêu cầu tính năng | Feature Request
description: Đề xuất một tính năng mới | Suggest a new feature
title: "[Feature]: "
labels: ["enhancement", "Cần thảo luận | need-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn vì lời khuyên! Chúng tôi muốn nghe suy nghĩ của bạn.
        Thank you for your suggestion! We're excited to hear your ideas.

  - type: checkboxes
    id: pre-check
    attributes:
      label: Kiểm tra trước | Pre-check
      description: Vui lòng xác nhận những điều sau trước khi gửi | Please confirm the following before submitting
      options:
        - label: Tôi đã tìm kiếm [Issues](https://github.com/lakernote/easy-postman/issues) và [Discussions](https://github.com/lakernote/easy-postman/discussions)，Không tìm thấy yêu cầu tính năng tương tự | I have searched Issues and Discussions and found no similar feature requests
          required: true
        - label: Tôi đã đọc nó [Mô tả chức năng](https://github.com/lakernote/easy-postman#-features)，Xác nhận đây là một tính năng mới | I have read the feature list and confirmed this is a new feature
          required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Loại chức năng | Feature Type
      description: Tính năng này thuộc loại nào? . | What category does this feature belong to?
      options:
        - 🔌 API gỡ lỗi | API Debugging
        - ⚡ Kiểm tra hiệu suất | Performance Testing
        - 🌍 Quản lý môi trường | Environment Management
        - 📝 Chức năng kịch bản | Script Features
        - 🏢 khu vực làm việc | Workspace
        - 🔄 Nhập và xuất dữ liệu | Data Import/Export
        - 🎨 UI/UX cải thiện | UI/UX Improvement
        - 📊 Phân tích dữ liệu | Data Analysis
        - 🔐 An ninh | Security
        - 🌐 Hỗ trợ giao thức | Protocol Support
        - 📚 Tài liệu | Documentation
        - 🔧 khác | Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Mô tả vấn đề | Problem Description
      description: Bạn đã gặp phải vấn đề gì? Tính năng này có thể giải quyết những điểm yếu nào? . | What problem are you facing? What pain point would this feature solve?
      placeholder: |
        Tôi đang sử dụng EasyPostman , thường xuyên gặp phải... Điều này khiến tôi cảm thấy rất bất tiện...
        When using EasyPostman, I often encounter... which is inconvenient...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: giải pháp mong muốn | Desired Solution
      description: Bạn hy vọng giải quyết được vấn đề này như thế nào? Mô tả chi tiết chức năng mong muốn của bạn | How would you like to solve this? Describe your desired feature in detail
      placeholder: |
        Tôi hy vọng EasyPostman Có thể...
        I would like EasyPostman to be able to...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Kịch bản sử dụng | Use Case
      description: Các tình huống sử dụng cụ thể của chức năng này là gì? . | What are the specific use cases for this feature?
      placeholder: |
        bối cảnh1：Khi tôi... khi tôi cần nó...
        bối cảnh2：Vào... Trong một số trường hợp, chức năng này có thể được sử dụng...

        Scenario 1: When I... I need to...
        Scenario 2: In... situation, this feature could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Các lựa chọn thay thế | Alternatives
      description: Bạn đã xem xét các giải pháp khác chưa? . | Have you considered any alternative solutions?
      placeholder: |
        Tôi cũng đã nghĩ về nó... Nhưng...
        I also considered... but...

  - type: textarea
    id: mockup
    attributes:
      label: Thiết kế giao diện (tùy chọn)| UI Mockup (Optional)
      description: Nếu có liên quan UI Để sửa đổi, bản vẽ thiết kế hoặc sơ đồ có thể được cung cấp | If UI changes are involved, you can provide mockups or sketches
      placeholder: Kéo và thả hình ảnh vào đây | Drag and drop images here

  - type: textarea
    id: reference
    attributes:
      label: Thực hiện tham khảo | Reference Implementation
      description: Có cách triển khai tương tự trong các công cụ khác không? . | Are there similar implementations in other tools?
      placeholder: |
        Postman của XXX Chức năng...
        JMeter của XXX Đặc điểm...

        Postman's XXX feature...
        JMeter's XXX feature...

  - type: dropdown
    id: priority
    attributes:
      label: ưu tiên | Priority
      description: Bạn nghĩ tính năng này quan trọng như thế nào? . | How important do you think this feature is?
      options:
        - 🔴 Cao - Ảnh hưởng nghiêm trọng đến trải nghiệm người dùng | High - Seriously affects user experience
        - 🟡 ở giữa - Trải nghiệm người dùng đã được cải thiện đáng kể | Medium - Significantly improves user experience
        - 🟢 thấp - Lớp kem trên bánh | Low - Nice to have
    validations:
      required: true

  - type: dropdown
    id: users
    attributes:
      label: Mang lại lợi ích cho người dùng | Beneficiary Users
      description: Bạn nghĩ có bao nhiêu người dùng sẽ được hưởng lợi từ tính năng này? . | How many users do you think would benefit from this feature?
      options:
        - Tất cả người dùng | All users
        - hầu hết người dùng | Most users
        - Một số người dùng | Some users
        - Ít người dùng | Few users
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Sẵn sàng đóng góp | Willingness to Contribute
      description: Bạn có sẵn sàng tham gia phát triển tính năng này không? . | Are you willing to contribute to this feature?
      options:
        - label: Tôi sẵn sàng phục tùng PR để thực hiện chức năng này | I'm willing to submit a PR to implement this feature
        - label: Tôi có thể giúp kiểm tra chức năng này | I can help test this feature
        - label: Tôi có thể cung cấp thêm các tình huống sử dụng và phản hồi | I can provide more use cases and feedback

  - type: textarea
    id: additional
    attributes:
      label: Thông tin bổ sung | Additional Context
      description: Thông tin khác sẽ giúp chúng tôi hiểu yêu cầu tính năng này | Any other information that helps us understand this feature request
      placeholder: Ví dụ: các tài liệu kỹ thuật liên quan.API Tài liệu vv | e.g. related technical docs, API docs, etc.

