name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome new contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isIssue = context.payload.issue !== undefined;

            if (isIssue) {
              // Check if this is the user's first issue
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                creator: context.payload.sender.login,
                state: 'all'
              });

              const isFirstIssue = issues.data.length === 1;

              if (isFirstIssue) {
                const issueComment = `👋 Xin chào @${context.payload.sender.login}！Cảm ơn bạn đã gửi cái đầu tiên Issue！

              Hi @${context.payload.sender.login}! Thank you for submitting your first issue!

              Chúng tôi sẽ kiểm tra và liên hệ lại với bạn trong thời gian sớm nhất. Trong khi chờ đợi, bạn có thể:
              We'll review and respond as soon as possible. While waiting, you can:

              - 📖 Xem [Tài liệu](https://github.com/lakernote/easy-postman#readme) | Check the [documentation](https://github.com/lakernote/easy-postman#readme)
              - 💬 Tham gia [Bảng thảo luận](https://github.com/lakernote/easy-postman/discussions) | Join the [Discussions](https://github.com/lakernote/easy-postman/discussions)
              - ⭐ Hãy ủng hộ dự án Star！| Give the project a Star!

              Nếu bạn muốn giúp giải quyết vấn đề này, vui lòng gửi PR！
              If you'd like to help fix this issue, PRs are welcome!
              `;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: issueComment
                });
              }
            } else {
              // Check if this is the user's first PR
              const pulls = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                creator: context.payload.sender.login
              });

              const isFirstPR = pulls.data.length === 1;

              if (isFirstPR) {
                const prComment = `🎉 Cảm ơn vì điều đầu tiên Pull Request @${context.payload.sender.login}！

              🎉 Thank you for your first Pull Request @${context.payload.sender.login}!

              Những người bảo trì của chúng tôi sẽ xem xét mã của bạn sớm nhất có thể. Trong khi chờ đợi, hãy đảm bảo:
              Our maintainers will review your code soon. While waiting, please ensure:

              - ✅ Mã biên dịch thành công | Code compiles successfully
              - ✅ Tất cả các bài kiểm tra đã vượt qua | All tests pass
              - ✅ Theo dõi [Nguyên tắc đóng góp](https://github.com/lakernote/easy-postman/blob/master/.github/CONTRIBUTING.md) | Follow the [Contributing Guide](https://github.com/lakernote/easy-postman/blob/master/.github/CONTRIBUTING.md)
              - ✅ PR Mô tả rõ ràng và đầy đủ | PR description is clear and complete

              Cảm ơn một lần nữa vì sự đóng góp của bạn! .🙏
              Thank you again for your contribution! 🙏
              `;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: prComment
                });
              }
            }
