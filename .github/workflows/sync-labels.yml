# Tên quy trình làm việc: Đồng bộ hóa thẻ
name: Sync Labels

# Điều kiện kích hoạt
on:
  # Khi bị đẩy tới master chi nhánh, và .github/labels.json Được kích hoạt khi tập tin thay đổi
  push:
    branches:
      - master
    paths:
      - '.github/labels.json'
  # Cho phép kích hoạt quy trình công việc theo cách thủ công
  workflow_dispatch:

jobs:
  sync-labels:
    # Môi trường chạy: Sử dụng phiên bản mới nhất Ubuntu
    runs-on: ubuntu-latest
    # Cài đặt quyền: Cho phép viết issues（bao gồm quản lý thẻ)
    permissions:
      issues: write

    steps:
      # Bước một: Kiểm tra kho lưu trữ mã
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bước 2: Đồng bộ cấu hình nhãn thành GitHub nhà kho
      - name: Sync labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const names = new Set();

            for (const label of labels) {
              const key = label.name.toLowerCase();
              if (names.has(key)) {
                core.setFailed(`Duplicate label name: ${label.name}`);
                return;
              }
              names.add(key);
            }

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existingByName = new Map(
              existing.map(label => [label.name.toLowerCase(), label])
            );

            for (const label of labels) {
              const current = existingByName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
                continue;
              }

              if (current.color.toLowerCase() !== label.color.toLowerCase()
                  || (current.description || '') !== label.description
                  || current.name !== label.name) {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: current.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }
