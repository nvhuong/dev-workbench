        run: |
          rm -rf target/runtime
          # Tạo macOS ARM nền tảng JRE
          jlink \
            --add-modules ${{ env.JLINK_MODULES }} \
            --strip-java-debug-attributes \
            --strip-native-commands \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --verbose \
            --output target/runtime

