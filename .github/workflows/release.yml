          check-latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Fat JAR（Tải xuống đa nền tảng Fat JAR）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: target

      - name: Install dependencies（Cài đặt phụ thuộc hệ thống)
        run: |
          sudo apt-get update
          # Cài đặt GTK3、WebKit、Dụng cụ đóng gói cũng vậy DEB Tương thích với các công cụ nén cần thiết để đóng gói lại
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev binutils zstd xz-utils

      - name: Create runtime with jlink（sử dụng jlink Tạo Linux tinh giản JRE）
        run: |
          rm -rf target/runtime
          # Tạo Linux nền tảng JRE
          jlink \
            --add-modules ${{ env.JLINK_MODULES }} \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output target/runtime

      - name: Prepare dist-input（Chuẩn bị thư mục đầu vào bao bì)
