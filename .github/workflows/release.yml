  # Tải tất cả các tập tin nền tảng lên GitHub Release
  # sử dụng softprops/action-gh-release@v2，Điều kiện kích hoạt:release sự kiện
  # always() Đảm bảo tải lên các tệp thành công ngay cả khi một phần của quá trình xây dựng không thành công
  # ============================================================
  upload-to-github-release:
    name: Upload All to GitHub Release（Tải lên  GitHub Release）
    if: always() && (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release'
    needs: [ build-windows-portable, build-windows-exe, build-macos-intel, build-macos-arm, build-jar, build-ubuntu-amd64, build-ubuntu-arm64, build-rpm-amd64, build-rpm-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts（Tải xuống tất cả các bản dựng nền tảng)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-artifacts
          pattern: EasyPostman-*
          merge-multiple: true

      - name: List downloaded files（Liệt kê tất cả các tập tin đã tải xuống)
        run: |
          echo "📦 Downloaded artifacts:"
          find all-artifacts -type f | sort

      - name: Upload all files to GitHub Release（Tải tất cả các tập tin lên Release）
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            all-artifacts/*-portable.zip
            all-artifacts/*.exe
            all-artifacts/*-macos-x86_64.dmg
            all-artifacts/*-macos-arm64.dmg
            all-artifacts/*.jar
            all-artifacts/*.deb
            all-artifacts/*.rpm
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Kiểm tra xem ít nhất một bản dựng có thành công hay không (đối với  Gitee Đánh giá đồng bộ)
  # ============================================================
  check-any-build-success:
    name: Check Any Build Success（Kiểm tra xem ít nhất một bản dựng đã thành công)
    if: |
      (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) &&
      github.event_name == 'release' &&
      always()
    needs: [ build-jar, build-windows-portable, build-windows-exe, build-macos-arm ]
    runs-on: ubuntu-latest
    outputs:
      should_create_release: ${{ steps.check.outputs.should_create }}

    steps:
      - name: Check if any build succeeded（Kiểm tra xem có bản dựng nào thành công không)
        id: check
        run: |
          echo "📊 Kiểm tra trạng thái xây dựng..."
          echo "  Standalone JAR: ${{ needs.build-jar.result }}"
          echo "  Windows Portable: ${{ needs.build-windows-portable.result }}"
          echo "  Windows EXE: ${{ needs.build-windows-exe.result }}"
          echo "  macOS ARM: ${{ needs.build-macos-arm.result }}"

          # Tạo miễn là một người thành công Release
          if [ "${{ needs.build-jar.result }}" == "success" ] || \
             [ "${{ needs.build-windows-portable.result }}" == "success" ] || \
             [ "${{ needs.build-windows-exe.result }}" == "success" ] || \
             [ "${{ needs.build-macos-arm.result }}" == "success" ]; then
            echo "✅ Ít nhất một bản dựng đã thành công và có thể được tạo Gitee Release"
            echo "should_create=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Tất cả các bản dựng đều thất bại, quá trình tạo bị bỏ qua Gitee Release"
            echo "should_create=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # ============================================================
  # Kiểm tra Gitee Kích thước tệp đính kèm (vượt quá  100MB trực tiếp thất bại)
  # ============================================================
  verify-gitee-assets:
    name: Verify Gitee Assets（Kiểm tra Gitee kích thước tệp đính kèm)
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release' && needs.check-any-build-success.outputs.should_create_release == 'true'
    needs: [ check-any-build-success, build-jar, build-windows-portable, build-windows-exe, build-macos-arm ]
    runs-on: ubuntu-latest

    steps:
      - name: Download standalone JAR artifact（Tải xuống độc lập JAR sản phẩm)
        if: needs.build-jar.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-Standalone-JAR
          path: verify/jar

      - name: Download Windows Portable artifact（tải về Windows Sản phẩm phiên bản xanh)
        if: needs.build-windows-portable.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-Windows-Portable
          path: verify/windows-portable

      - name: Download Windows EXE artifact（tải về Windows EXE sản phẩm)
        if: needs.build-windows-exe.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-Windows-EXE
          path: verify/windows-exe

      - name: Download macOS ARM artifact（tải về macOS ARM sản phẩm)
        if: needs.build-macos-arm.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-macOS-ARM-DMG
          path: verify/macos-arm

      - name: Validate asset size（Xác minh kích thước tệp đính kèm)
        run: |
          validate_file() {
            FILE="$1"
            LABEL="$2"
            if [ ! -f "$FILE" ]; then
              echo "❌ Missing expected artifact for $LABEL: $FILE"
              exit 1
            fi

            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE")
            FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE/1048576" | bc)
            echo "📏 $LABEL: ${FILE_SIZE_MB} MB"

            if [ "$FILE_SIZE" -gt 104857600 ]; then
              echo "❌ $LABEL exceeds Gitee 100MB limit: ${FILE_SIZE_MB} MB"
              exit 1
            fi
          }

          if [ "${{ needs.build-jar.result }}" = "success" ]; then
            validate_file "$(find verify/jar -name '*.jar' | head -n 1)" "Standalone JAR"
          fi

          if [ "${{ needs.build-windows-portable.result }}" = "success" ]; then
            validate_file "$(find verify/windows-portable -name '*-portable.zip' | head -n 1)" "Windows Portable"
          fi

          if [ "${{ needs.build-windows-exe.result }}" = "success" ]; then
            validate_file "$(find verify/windows-exe -name '*.exe' | head -n 1)" "Windows EXE"
          fi

          if [ "${{ needs.build-macos-arm.result }}" = "success" ]; then
            validate_file "$(find verify/macos-arm -name '*-macos-arm64.dmg' | head -n 1)" "macOS ARM"
          fi

  # ============================================================
  # Tạo Gitee Release
  # ============================================================
  create-gitee-release:
    name: Create Gitee Release（Tạo Gitee Release）
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release' && needs.check-any-build-success.outputs.should_create_release == 'true'
    needs: [ get-version, check-any-build-success, verify-gitee-assets ]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.gitee_release.outputs.release_id }}
      tag_name: ${{ steps.get_version.outputs.tag }}

    steps:
      - name: Get version from tag（Lấy số phiên bản từ thẻ)
        id: get_version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create Gitee Release（Tạo Gitee Release）
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="${{ steps.get_version.outputs.tag }}"
          RELEASE_BODY="${{ github.event.release.body }}"

          if [ -z "$RELEASE_BODY" ]; then
            RELEASE_BODY="EasyPostman ${VERSION} Phiên bản phát hành, được hỗ trợ Windows、macOS và Linux。"
          fi

          # Bó body Ghi vào một tập tin tạm thời để thuận tiện cho việc xử lý các ký tự đặc biệt
          BODY_FILE="/tmp/release_body.txt"
          printf '%s\n' "${RELEASE_BODY}" > "$BODY_FILE"

          echo "🚀 Creating Gitee Release for tag: $TAG_NAME"

          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "❌ Missing GITEE_TOKEN secret"
            exit 1
          fi

          RESPONSE_FILE="/tmp/release.json"
          GITEE_RELEASES_API="https://gitee.com/api/v5/repos/lakernote/easy-postman/releases"
          RELEASE_ID=""

          resolve_existing_release() {
            local curl_exit_code
            local http_code

            if http_code=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 60 \
                --get \
                --data-urlencode "access_token=${GITEE_TOKEN}" \
                "${GITEE_RELEASES_API}/tags/${TAG_NAME}"); then
              curl_exit_code=0
            else
              curl_exit_code=$?
            fi

            if [ "$curl_exit_code" -eq 0 ] && [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              RELEASE_ID=$(jq -r '.id // empty' "$RESPONSE_FILE" 2>/dev/null || true)
            fi
          }

          # A rerun may encounter a release created by an earlier partial run.
          resolve_existing_release

          if [ -n "$RELEASE_ID" ]; then
            echo "✅ Reusing existing Gitee Release with ID: $RELEASE_ID"
          else
            if HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                --connect-timeout 30 \
                --max-time 60 \
                -X POST \
                -F "access_token=${GITEE_TOKEN}" \
                -F "tag_name=$TAG_NAME" \
                -F "name=$TAG_NAME" \
                -F "body=<${BODY_FILE}" \
                -F "prerelease=false" \
                -F "target_commitish=master" \
                "$GITEE_RELEASES_API"); then
              CURL_EXIT_CODE=0
            else
              CURL_EXIT_CODE=$?
            fi

            echo "curl exit code: $CURL_EXIT_CODE"
            echo "HTTP Status Code: $HTTP_CODE"

            if [ $CURL_EXIT_CODE -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              RELEASE_ID=$(jq -r '.id // empty' "$RESPONSE_FILE" 2>/dev/null || true)
            else
              # The create request may have succeeded even if its response was lost.
              echo "⚠️ Create request failed; checking whether the release now exists..."
              resolve_existing_release
            fi
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Failed to create or resolve Gitee Release for tag $TAG_NAME"
            cat "$RESPONSE_FILE" 2>/dev/null || echo "No response file"
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Gitee Release created successfully with ID: $RELEASE_ID"

  # Đa nền tảng JAR Tải lên Gitee
  sync-jar-to-gitee:
    name: Upload Standalone JAR to Gitee（Tải lên độc lập JAR Đến Gitee）
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release' && needs.build-jar.result == 'success'
    needs: [ create-gitee-release, build-jar ]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download standalone JAR artifact（Tải xuống độc lập JAR sản phẩm)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-Standalone-JAR
          path: artifacts

      - name: Upload standalone JAR to Gitee（Tải lên độc lập JAR Đến Gitee）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          RELEASE_ID="${{ needs.create-gitee-release.outputs.release_id }}"
          FILE=$(find artifacts -name "*.jar" | head -n 1)
          bash .github/scripts/upload-gitee-release-asset.sh "$RELEASE_ID" "$FILE"

  # Windows Phiên bản màu xanh lá cây được tải lên Gitee
  sync-windows-portable-to-gitee:
    name: Upload Windows Portable to Gitee（Tải lên Windows Phiên bản xanh đã về Gitee）
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release' && needs.build-windows-portable.result == 'success'
    needs: [ create-gitee-release, build-windows-portable ]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows Portable artifact（tải về Windows Sản phẩm phiên bản xanh)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-Windows-Portable
          path: artifacts

      - name: Upload Windows Portable to Gitee（Tải lên Windows Phiên bản xanh đã về Gitee）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          RELEASE_ID="${{ needs.create-gitee-release.outputs.release_id }}"
          FILE=$(find artifacts -name "*-portable.zip" | head -n 1)
          bash .github/scripts/upload-gitee-release-asset.sh "$RELEASE_ID" "$FILE"

  # Windows EXE Tải lên Gitee
  sync-windows-exe-to-gitee:
    name: Upload Windows EXE to Gitee（Tải lên Windows EXE Đến Gitee）
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release' && needs.build-windows-exe.result == 'success'
    needs: [ create-gitee-release, build-windows-exe ]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows EXE artifact（tải về Windows EXE sản phẩm)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-Windows-EXE
          path: artifacts

      - name: Upload Windows EXE to Gitee（Tải lên Windows EXE Đến Gitee）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          RELEASE_ID="${{ needs.create-gitee-release.outputs.release_id }}"
          FILE=$(find artifacts -name "*.exe" | head -n 1)
          bash .github/scripts/upload-gitee-release-asset.sh "$RELEASE_ID" "$FILE"

  # macOS ARM Tải lên Gitee
  sync-macos-to-gitee:
    name: Upload macOS ARM to Gitee（Tải lên macOS ARM Đến Gitee）
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release' && needs.build-macos-arm.result == 'success'
    needs: [ create-gitee-release, build-macos-arm ]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS ARM artifact（tải về macOS ARM sản phẩm)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: EasyPostman-macOS-ARM-DMG
          path: artifacts

      - name: Upload macOS ARM to Gitee（Tải lên macOS ARM Đến Gitee）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          RELEASE_ID="${{ needs.create-gitee-release.outputs.release_id }}"
          FILE=$(find artifacts -name "*-macos-arm64.dmg" | head -n 1)
          bash .github/scripts/upload-gitee-release-asset.sh "$RELEASE_ID" "$FILE"

  # Kết quả tổng hợp
  sync-summary:
    name: Sync Summary（tóm tắt đồng bộ)
    if: |
      (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) &&
      github.event_name == 'release' &&
      always()
    needs: [ check-any-build-success, verify-gitee-assets, create-gitee-release, sync-jar-to-gitee, sync-windows-portable-to-gitee, sync-windows-exe-to-gitee, sync-macos-to-gitee ]
    runs-on: ubuntu-latest

    steps:
      - name: Summary（bản tóm tắt)
        run: |
          echo "📊 Gitee Release Đồng bộ hóa hoàn tất! ."

          CHECK_STATUS="${{ needs.check-any-build-success.result }}"
          VERIFY_STATUS="${{ needs.verify-gitee-assets.result }}"
          RELEASE_STATUS="${{ needs.create-gitee-release.result }}"
          JAR_STATUS="${{ needs.sync-jar-to-gitee.result }}"
          PORTABLE_STATUS="${{ needs.sync-windows-portable-to-gitee.result }}"
          EXE_STATUS="${{ needs.sync-windows-exe-to-gitee.result }}"
          MACOS_STATUS="${{ needs.sync-macos-to-gitee.result }}"

          echo ""
          echo "🔍 Xây dựng kết quả kiểm tra: $CHECK_STATUS"
          echo "📏 Gitee Xác minh tệp đính kèm: $VERIFY_STATUS"
          echo "📝 Gitee Release Tạo: $RELEASE_STATUS"

          if [ "$RELEASE_STATUS" == "success" ]; then
            echo "📍 Release URL: https://gitee.com/lakernote/easy-postman/releases/${{ needs.create-gitee-release.outputs.tag_name }}"
          fi

          echo ""
          echo "Đã đồng bộ hóa với Gitee Tập tin:"
          echo "  ☕ Standalone JAR - $JAR_STATUS"
          echo "  📦 Windows Portable (Phiên bản màu xanh lá cây) - $PORTABLE_STATUS"
          echo "  🪟 Windows EXE (Cài đặt gói) - $EXE_STATUS"
          echo "  🍎 macOS Apple Silicon (ARM64) - $MACOS_STATUS"
          echo ""

          if [ "$CHECK_STATUS" == "failure" ]; then
            echo "❌ Tất cả các bản dựng đều thất bại và không được tạo Gitee Release"
            exit 1
          fi

          if [ "$VERIFY_STATUS" == "failure" ] || [ "$RELEASE_STATUS" == "failure" ] || \
             [ "$JAR_STATUS" == "failure" ] || [ "$PORTABLE_STATUS" == "failure" ] || \
             [ "$EXE_STATUS" == "failure" ] || [ "$MACOS_STATUS" == "failure" ]; then
            echo "❌ Gitee Release Có những bước không thành công trong quá trình này"
            exit 1
          fi

          echo "✅ Gitee Release Quá trình tạo thành công và tệp đính kèm được tải lên"
