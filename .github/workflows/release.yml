name: Release Build（bản phát hành)

permissions:
  contents: write

on:
  release:
    types: [ created ]  # Khi tạo cái mới Release được kích hoạt khi nào
  workflow_dispatch: { }  # Hỗ trợ kích hoạt thủ công

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'jetbrains'  # sử dụng JetBrains Runtime（JBR），vì Swing Tối ưu hóa ứng dụng
  JLINK_MODULES: 'java.base,java.desktop,java.logging,jdk.unsupported,java.naming,java.net.http,jdk.httpserver,java.prefs,java.sql,java.security.sasl,java.security.jgss,jdk.crypto.ec,java.management,java.management.rmi,jdk.crypto.cryptoki'
  # Phổ quát Java Tùy chọn (được chia sẻ bởi tất cả các nền tảng)
  JAVA_OPTIONS_COMMON: '-Xms256m|-Xmx1g|-XX:MaxMetaspaceSize=256m|-XX:MetaspaceSize=128m|-XX:MaxDirectMemorySize=256m|-XX:+UseG1GC|-XX:MaxGCPauseMillis=200|-XX:InitiatingHeapOccupancyPercent=45|-XX:+UseStringDeduplication|-XX:+HeapDumpOnOutOfMemoryError|-XX:HeapDumpPath=./dumps|-Dfile.encoding=UTF-8|-Dswing.aatext=true|-Dhttp.keepAlive=true'
  # Windows Tùy chọn cụ thể
  JAVA_OPTIONS_WINDOWS: '-Djavax.accessibility.assistive_technologies='
  # macOS Tùy chọn cụ thể
  JAVA_OPTIONS_MACOS: '-Dsun.java2d.metal=false|-Dapple.awt.application.appearance=system|--add-opens java.desktop/java.awt=ALL-UNNAMED|--add-opens java.desktop/sun.lwawt=ALL-UNNAMED|--add-opens java.desktop/sun.lwawt.macosx=ALL-UNNAMED|--add-exports java.desktop/com.apple.eawt=ALL-UNNAMED'
  # Linux Tùy chọn cụ thể
  JAVA_OPTIONS_LINUX: '-Dawt.useSystemAAFontSettings=on|--add-opens=java.desktop/sun.awt.X11=ALL-UNNAMED'

jobs:
  # Trích xuất số phiên bản cho tất cả job Tái sử dụng
  get-version:
    name: Get Version（Lấy số phiên bản)
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

      - name: Setup Java（cấu hình Java）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          check-latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version（Trích xuất số phiên bản)
        id: extract_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate release source and version（Xác minh tính nhất quán của nhánh và phiên bản mặc định)
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          CURRENT_REF="${{ github.ref_name }}"
          VERSION="${{ steps.extract_version.outputs.version }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$CURRENT_REF" != "$DEFAULT_BRANCH" ]; then
            echo "workflow_dispatch is only allowed from the default branch: ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            TARGET_COMMITISH="${{ github.event.release.target_commitish }}"
            EXPECTED_TAG="v${VERSION}"

            if [ "$TARGET_COMMITISH" != "$DEFAULT_BRANCH" ]; then
              echo "Release must target default branch ${DEFAULT_BRANCH}, got ${TARGET_COMMITISH}" >&2
              exit 1
            fi

            if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
              echo "Release tag ${TAG_NAME} does not match pom version ${VERSION}" >&2
              exit 1
            fi
          fi

  # Xây dựng Fat JAR（Đa nền tảng) để tái sử dụng trên tất cả các nền tảng
  build-jar-artifact:
    name: Build Fat JAR（Xây dựng đa nền tảng JAR）
    runs-on: ubuntu-latest
    needs: [ get-version ]
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')
    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java（cấu hình Java）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          check-latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven（sử dụng Maven Xây dựng Fat JAR）
        run: mvn -B clean package -DskipTests

      - name: Upload JAR for reuse（Tải lên JAR cho người khác job tái sử dụng)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-jar
          path: dev-workbench-app/target/dev-workbench-${{ needs.get-version.outputs.version }}.jar
          retention-days: 1


  build-windows-portable:
    name: Build Windows Portable（Xây dựng Windows phiên bản màu xanh lá cây)
    runs-on: windows-latest
    needs: [ get-version, build-jar-artifact ]
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java（cấu hình Java）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Fat JAR（Tải xuống đa nền tảng Fat JAR）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: target

      - name: Create runtime with jlink（sử dụng jlink Tạo Windows tinh giản JRE）
        shell: pwsh
        run: |
          $runtimeDir = "target\runtime"
          if (Test-Path $runtimeDir) { Remove-Item -Recurse -Force $runtimeDir }

          jlink `
            --add-modules "$env:JLINK_MODULES,jdk.crypto.mscapi" `
            --strip-java-debug-attributes `
            --strip-native-commands `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --verbose `
            --output $runtimeDir

          # Xác minh JRE kích thước
          $size = (Get-ChildItem -Path $runtimeDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "✅ JRE Tạo thành công, kích thước: $([math]::Round($size, 2)) MB"

      - name: Prepare dist-input（Chuẩn bị thư mục đầu vào bao bì)
        shell: pwsh
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $jarNameWithVersion = "dev-workbench-$version.jar"
          $jarName = "dev-workbench.jar"

          $distInputDir = "target\dist-input"
          if (Test-Path $distInputDir) { Remove-Item -Recurse -Force $distInputDir }
          New-Item -ItemType Directory -Path $distInputDir | Out-Null
          Copy-Item "target\$jarNameWithVersion" -Destination "$distInputDir\$jarName"

      - name: Create app-image with jpackage（Tạo hình ảnh ứng dụng, không cần cài đặt)
        shell: pwsh
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $jarName = "dev-workbench.jar"
          $appImageDir = "target\app-image"

          if (Test-Path $appImageDir) { Remove-Item -Recurse -Force $appImageDir }

          # Phân tích chung Java tùy chọn
          $javaOptsCommon = $env:JAVA_OPTIONS_COMMON -split '\|'
          # phân tích Windows Tùy chọn cụ thể
          $javaOptsWindows = $env:JAVA_OPTIONS_WINDOWS -split '\|'

          # Xây dựng jpackage Danh sách tham số
          $jpackageArgs = @(
            '--type', 'app-image',
            '--input', 'target\dist-input',
            '--main-jar', $jarName,
            '--main-class', 'com.nvhuong.devworkbench.App',
            '--add-launcher', 'DevWorkbenchMCP=build\dev-workbench-mcp-launcher.properties',
            '--runtime-image', 'target\runtime',
            '--dest', 'target',
            '--icon', 'assets\win\DevWorkbench.ico',
            '--name', 'DevWorkbench',
            '--app-version', $version,
            '--vendor', 'Nvhuong',
            '--copyright', '© 2025 Nvhuong'
          )

          # Đã thêm phổ quát Java tùy chọn
          foreach ($opt in $javaOptsCommon) {
            $jpackageArgs += '--java-options'
            $jpackageArgs += $opt
          }

          # Thêm vào Windows Tùy chọn cụ thể
          foreach ($opt in $javaOptsWindows) {
            if ($opt -ne '') {
              $jpackageArgs += '--java-options'
              $jpackageArgs += $opt
            }
          }

          # thực hiện jpackage
          & jpackage @jpackageArgs

          if (-not (Test-Path "target\DevWorkbench\DevWorkbenchMCP.exe")) {
            throw "MCP launcher was not created"
          }

      - name: Package portable version（Phiên bản màu xanh lá cây được đóng gói dưới dạng ZIP）
        shell: pwsh
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $appImageDir = "target\DevWorkbench"
          $zipName = "DevWorkbench-$version-windows-x64-portable.zip"

          if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" | Out-Null }

          # Tạo .portable Tệp nhận dạng được sử dụng để phát hiện các phiên bản di động khi chạy
          $portableMarker = Join-Path $appImageDir ".portable"
          "This is a portable version" | Out-File -FilePath $portableMarker -Encoding UTF8
          Write-Host "Created .portable marker file"

          # Đã nén thành  ZIP
          Compress-Archive -Path $appImageDir -DestinationPath "dist\$zipName" -Force

          Write-Host "✅ Created portable version: $zipName"

      - name: Upload as Artifact（Tải lên dưới dạng sản phẩm xây dựng)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DevWorkbench-Windows-Portable
          path: dist/*-portable.zip
          retention-days: 7


  build-windows-exe:
    name: Build Windows EXE Installer（Xây dựng Windows EXE trình cài đặt)
    runs-on: windows-latest
    needs: [ get-version, build-jar-artifact ]
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java（cấu hình Java）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Fat JAR（Tải xuống đa nền tảng Fat JAR）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: target

      - name: Install Inno Setup（Cài đặt Inno Setup）
        shell: pwsh
        run: |
          Write-Host "📦 Installing Inno Setup..."
          choco install innosetup -y --no-progress

          # Làm mới các biến môi trường
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # Xác minh cài đặt
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) {
            Write-Host "✅ Inno Setup installed: $($iscc.Source)"
            # Hiển thị thông tin phiên bản (iscc Nếu không có tham số, phiên bản và trợ giúp sẽ được hiển thị)
            & iscc 2>&1 | Select-Object -First 5
          } else {
            Write-Error "❌ Inno Setup installation failed"
            exit 1
          }

      - name: Create runtime with jlink（sử dụng jlink Tạo Windows tinh giản JRE）
        shell: pwsh
        run: |
          $runtimeDir = "target\runtime"
          if (Test-Path $runtimeDir) { Remove-Item -Recurse -Force $runtimeDir }

          jlink `
            --add-modules "$env:JLINK_MODULES,jdk.crypto.mscapi" `
            --strip-java-debug-attributes `
            --strip-native-commands `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --verbose `
            --output $runtimeDir

          # Xác minh JRE kích thước
          $size = (Get-ChildItem -Path $runtimeDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "✅ JRE Tạo thành công, kích thước: $([math]::Round($size, 2)) MB"

      - name: Prepare dist-input（Chuẩn bị thư mục đầu vào bao bì)
        shell: pwsh
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $jarNameWithVersion = "dev-workbench-$version.jar"
          $jarName = "dev-workbench.jar"

          $distInputDir = "target\dist-input"
          if (Test-Path $distInputDir) { Remove-Item -Recurse -Force $distInputDir }
          New-Item -ItemType Directory -Path $distInputDir | Out-Null
          Copy-Item "target\$jarNameWithVersion" -Destination "$distInputDir\$jarName"

      - name: Create app-image with jpackage（Tạo một hình ảnh ứng dụng)
        shell: pwsh
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $jarName = "dev-workbench.jar"

          # Phân tích chung Java tùy chọn
          $javaOptsCommon = $env:JAVA_OPTIONS_COMMON -split '\|'
          # phân tích Windows Tùy chọn cụ thể
          $javaOptsWindows = $env:JAVA_OPTIONS_WINDOWS -split '\|'

          # Xây dựng jpackage Danh sách tham số
          $jpackageArgs = @(
            '--type', 'app-image',
            '--input', 'target\dist-input',
            '--main-jar', $jarName,
            '--main-class', 'com.nvhuong.devworkbench.App',
            '--add-launcher', 'DevWorkbenchMCP=build\dev-workbench-mcp-launcher.properties',
            '--runtime-image', 'target\runtime',
            '--dest', 'target',
            '--icon', 'assets\win\DevWorkbench.ico',
            '--name', 'DevWorkbench',
            '--app-version', $version,
            '--vendor', 'Nvhuong',
            '--copyright', '© 2025 Nvhuong'
          )

          # Đã thêm phổ quát Java tùy chọn
          foreach ($opt in $javaOptsCommon) {
            $jpackageArgs += '--java-options'
            $jpackageArgs += $opt
          }

          # Thêm vào Windows Tùy chọn cụ thể
          foreach ($opt in $javaOptsWindows) {
            if ($opt -ne '') {
              $jpackageArgs += '--java-options'
              $jpackageArgs += $opt
            }
          }

          # thực hiện jpackage
          & jpackage @jpackageArgs

          if (-not (Test-Path "target\DevWorkbench\DevWorkbenchMCP.exe")) {
            throw "MCP launcher was not created"
          }

          Write-Host "✅ App image created at: target\DevWorkbench"

      - name: Verify Windows single-instance behavior（Xác minh Windows Trường hợp đơn lẻ và phục hồi bắt buộc)
        shell: pwsh
        timeout-minutes: 2
        run: |
          .\build\verify-windows-single-instance.ps1 `
            -AppExe "target\DevWorkbench\DevWorkbench.exe"

      - name: Create EXE with Inno Setup（sử dụng Inno Setup Tạo EXE trình cài đặt)
        shell: pwsh
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $issScript = "build\dev-workbench.iss"
          $arch = "x64"  # Hiện nay được xây dựng như x64，Nó có thể được mở rộng trong tương lai arm64

          # Hãy chắc chắn rằng thư mục đầu ra tồn tại
          if (-not (Test-Path "dist")) {
            New-Item -ItemType Directory -Path "dist" | Out-Null
          }

          Write-Host "🔨 Building EXE installer with Inno Setup..."
          Write-Host "   Version: $version"
          Write-Host "   Architecture: $arch"
          Write-Host "   Script: $issScript"
          Write-Host "   Source: target\DevWorkbench"

          # Xác minh rằng thư mục nguồn tồn tại
          if (-not (Test-Path "target\DevWorkbench")) {
            Write-Error "❌ Source directory not found: target\DevWorkbench"
            exit 1
          }

          # chạy Inno Setup trình biên dịch
          # LƯU Ý: Đường dẫn có liên quan đến  ISS vị trí tập lệnh (build thư mục), vì vậy cần thiết ..\
          & iscc `
            "/DMyAppVersion=$version" `
            "/DMyAppSourceDir=..\target\DevWorkbench" `
            "/DMyOutputDir=..\dist" `
            "/DMyArch=$arch" `
            $issScript

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Inno Setup compilation failed with exit code: $LASTEXITCODE"
            exit 1
          }

          # Xác minh EXE tập tin
          $expectedExeName = "DevWorkbench-$version-windows-$arch.exe"
          $exeFile = Get-Item "dist\$expectedExeName" -ErrorAction SilentlyContinue

          if ($exeFile) {
            Write-Host "✅ EXE installer created successfully!"
            Write-Host "   File: $($exeFile.Name)"
            Write-Host "   Size: $([math]::Round($exeFile.Length / 1MB, 2)) MB"
            Write-Host "   Path: $($exeFile.FullName)"
          } else {
            Write-Error "❌ Expected EXE file not found: $expectedExeName"
            Write-Host "Files in dist folder:"
            Get-ChildItem "dist" | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }

      - name: Upload as Artifact（Tải lên dưới dạng sản phẩm xây dựng)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DevWorkbench-Windows-EXE
          path: dist/*.exe
          retention-days: 7

  build-macos-intel:
    name: Build macOS Intel DMG（Xây dựng macOS Intel gói cài đặt phiên bản)
    runs-on: macos-15-intel  # Intel x86_64
    needs: [ get-version, build-jar-artifact ]
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java（cấu hình Java）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Fat JAR（Tải xuống đa nền tảng Fat JAR）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: target

      - name: Create runtime with jlink（sử dụng jlink Tạo macOS Intel tinh giản JRE）
        run: |
          rm -rf target/runtime
          # Tạo macOS Intel nền tảng JRE
          jlink \
            --add-modules ${{ env.JLINK_MODULES }} \
            --strip-java-debug-attributes \
            --strip-native-commands \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --verbose \
            --output target/runtime

          # Xác minh JRE kích thước
          echo "✅ JRE Tạo thành công, kích thước: $(du -sh target/runtime | cut -f1)"

      - name: Prepare dist-input（Chuẩn bị thư mục đầu vào bao bì)
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          rm -rf target/dist-input
          mkdir -p target/dist-input
          cp target/dev-workbench-$VERSION.jar target/dist-input/dev-workbench.jar

      - name: Create DMG with jpackage（sử dụng jpackage Tạo DMG gương)
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p dist

          # Phân tích chung Java tùy chọn
          IFS='|' read -ra JAVA_OPTS_COMMON <<< "${{ env.JAVA_OPTIONS_COMMON }}"
          # phân tích macOS Tùy chọn cụ thể
          IFS='|' read -ra JAVA_OPTS_MACOS <<< "${{ env.JAVA_OPTIONS_MACOS }}"

          # Xây dựng jpackage Mảng tham số
          JPACKAGE_ARGS=(
            --input target/dist-input
            --main-jar "dev-workbench.jar"
            --main-class com.nvhuong.devworkbench.App
            --add-launcher DevWorkbenchMCP=build/dev-workbench-mcp-launcher.properties
            --runtime-image target/runtime
            --type dmg
            --name "DevWorkbench"
            --app-version "$VERSION"
            --dest dist
            --icon assets/mac/DevWorkbench.icns
            --vendor "Nvhuong"
            --copyright "© 2025 Nvhuong"
          )

          # Đã thêm phổ quát Java tùy chọn
          for opt in "${JAVA_OPTS_COMMON[@]}"; do
            JPACKAGE_ARGS+=(--java-options "$opt")
          done

          # Thêm vào macOS Tùy chọn cụ thể
          for opt in "${JAVA_OPTS_MACOS[@]}"; do
            if [ -n "$opt" ]; then
              JPACKAGE_ARGS+=(--java-options "$opt")
            fi
          done

          # thực hiện jpackage
          jpackage "${JPACKAGE_ARGS[@]}"

