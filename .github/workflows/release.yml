    needs: [ get-version, build-jar-artifact ]
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')

    steps:
      - name: Checkout（Kiểm tra mã)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java（cấu hình Java）
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Fat JAR（Tải xuống đa nền tảng Fat JAR）
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: target

      - name: Create runtime with jlink（sử dụng jlink Tạo macOS ARM tinh giản JRE）
        run: |
          rm -rf target/runtime
          # Tạo macOS ARM nền tảng JRE
          jlink \
            --add-modules ${{ env.JLINK_MODULES }} \
            --strip-java-debug-attributes \
            --strip-native-commands \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --verbose \
            --output target/runtime

          # Xác minh JRE kích thước
          echo "✅ JRE Tạo thành công, kích thước: $(du -sh target/runtime | cut -f1)"

