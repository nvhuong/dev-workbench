          mkdir -p target/dist-input
          cp target/dev-workbench-$VERSION.jar target/dist-input/dev-workbench.jar

      - name: Create DEB with jpackage（sử dụng jpackage Tạo DEB gói cài đặt)
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          mkdir -p dist

          # Phân tích chung Java tùy chọn
          IFS='|' read -ra JAVA_OPTS_COMMON <<< "${{ env.JAVA_OPTIONS_COMMON }}"
          # phân tích Linux Tùy chọn cụ thể
          IFS='|' read -ra JAVA_OPTS_LINUX <<< "${{ env.JAVA_OPTIONS_LINUX }}"

          # Xây dựng jpackage Mảng tham số
          JPACKAGE_ARGS=(
            --input target/dist-input
            --main-jar "dev-workbench.jar"
            --main-class com.nvhuong.devworkbench.App
            --add-launcher DevWorkbenchMCP=build/dev-workbench-mcp-launcher.properties
            --runtime-image target/runtime
            --type deb
            --name "DevWorkbench"
            --app-version "$VERSION"
            --dest dist
            --vendor "Nvhuong"
            --copyright "© 2025 Nvhuong"
            --description "A modern API testing tool similar to DevWorkbench"
            --linux-shortcut
            --linux-menu-group "Development"
            --linux-app-category "Development"
          )

          # Đã thêm phổ quát Java tùy chọn
          for opt in "${JAVA_OPTS_COMMON[@]}"; do
            JPACKAGE_ARGS+=(--java-options "$opt")
          done

          # Thêm vào Linux Tùy chọn cụ thể
          for opt in "${JAVA_OPTS_LINUX[@]}"; do
            if [ -n "$opt" ]; then
              JPACKAGE_ARGS+=(--java-options "$opt")
            fi
          done

          # thực hiện jpackage
          jpackage "${JPACKAGE_ARGS[@]}"

      - name: Rename amd64 DEB to stable release name（thống nhất amd64 tên gói)
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          ORIGINAL_DEB=$(find dist -maxdepth 1 -type f -name "*.deb" | sort | tail -n 1)
          if [ -z "$ORIGINAL_DEB" ]; then
            echo "No DEB file available for renaming" >&2
            exit 1
          fi

          TARGET_DEB="dist/DevWorkbench-${VERSION}-linux-amd64.deb"
          mv "$ORIGINAL_DEB" "$TARGET_DEB"

          echo "Generated amd64 DEB:"
          ls -1 "$TARGET_DEB"

      - name: Upload as Artifact（Tải lên dưới dạng sản phẩm xây dựng)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
