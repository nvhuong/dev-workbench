  # Tải tất cả các tập tin nền tảng lên GitHub Release
  # sử dụng softprops/action-gh-release@v2，Điều kiện kích hoạt:release sự kiện
  # always() Đảm bảo tải lên các tệp thành công ngay cả khi một phần của quá trình xây dựng không thành công
  # ============================================================
  upload-to-github-release:
    name: Upload All to GitHub Release（Tải lên  GitHub Release）
    if: always() && (github.event_name != 'release' || startsWith(github.event.release.tag_name || '', 'v')) && github.event_name == 'release'
    needs: [ build-windows-portable, build-windows-exe, build-macos-intel, build-macos-arm, build-jar, build-ubuntu-amd64, build-ubuntu-arm64, build-rpm-amd64, build-rpm-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts（Tải xuống tất cả các bản dựng nền tảng)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-artifacts
          pattern: DevWorkbench-*
          merge-multiple: true

      - name: List downloaded files（Liệt kê tất cả các tập tin đã tải xuống)
        run: |
          echo "📦 Downloaded artifacts:"
          find all-artifacts -type f | sort

      - name: Upload all files to GitHub Release（Tải tất cả các tập tin lên Release）
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            all-artifacts/*-portable.zip
            all-artifacts/*.exe
            all-artifacts/*-macos-x86_64.dmg
            all-artifacts/*-macos-arm64.dmg
            all-artifacts/*.jar
            all-artifacts/*.deb
            all-artifacts/*.rpm
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
