# Tên quy trình làm việc: Tự động gắn nhãn
name: Auto Label

# Điều kiện kích hoạt
on:
  # Khi nào issue Được kích hoạt khi được tạo hoặc chỉnh sửa
  issues:
    types: [opened, edited]
  # Khi nào Pull Request Được kích hoạt khi được tạo hoặc chỉnh sửa (sử dụng  pull_request_target đảm bảo quyền)
  pull_request_target:
    types: [opened, edited]

jobs:
  auto-label:
    # Môi trường chạy: Sử dụng phiên bản mới nhất Ubuntu
    runs-on: ubuntu-latest
    # Cài đặt quyền: Cho phép viết issues và pull requests
    permissions:
      issues: write
      pull-requests: write

    steps:
      # Tự động issues và PRs Thêm thẻ
      - name: Auto label issues and PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Phán quyết là issue Vẫn pull request
            const isIssue = context.payload.issue !== undefined;
            const item = isIssue ? context.payload.issue : context.payload.pull_request;
            const title = item.title.toLowerCase();
            const body = (item.body || '').toLowerCase();
            const labels = [];

            // Phát hiện ngôn ngữ: nội dung có chữ cái riêng của tiếng Việt thì gắn nhãn 'vietnamese'
            if (/[ăâđêôơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/.test(title + ' ' + body)) {
              labels.push('vietnamese');
            }

            // Đã phát hiện từ tiêu đề issue loại
            if (title.includes('[bug]') || title.includes('bug:')) {
              labels.push('bug');  // Báo cáo lỗi
            }
            if (title.includes('[feature]') || title.includes('feat:')) {
              labels.push('enhancement');  // Cải tiến tính năng
            }
            if (title.includes('[question]') || title.includes('question:')) {
              labels.push('question');  // Tư vấn thắc mắc
            }
            if (title.includes('[docs]') || title.includes('documentation')) {
              labels.push('documentation');  // Tài liệu liên quan
            }

            // Phát hiện loại thành phần từ tiêu đề và nội dung (dựa trên việc khớp từ khóa)
            const components = {
              'ui': ['ui', 'interface', 'giao diện', 'trình diễn'],  // Giao diện người dùng liên quan
              'api': ['api', 'request', 'http', 'yêu cầu'],  // API và HTTP Request related
              'performance': ['performance', 'jmeter', 'hiệu suất', 'Kiểm tra căng thẳng'],  // Kiểm tra hiệu suất liên quan
              'workspace': ['workspace', 'git', 'khu vực làm việc'],  // Kiểm soát không gian làm việc và phiên bản
              'environment': ['environment', 'variable', 'môi trường', 'các biến'],  // các biến môi trường
              'script': ['script', 'javascript', 'kịch bản'],  // Chức năng kịch bản
              'network': ['network', 'websocket', 'sse', 'mạng'],  // Kết nối mạng
              'import-export': ['import', 'export', 'devworkbench', 'curl', 'Nhập khẩu', 'Xuất khẩu']  // Chức năng xuất nhập khẩu
            };

            // Duyệt qua các từ khóa thành phần và thêm các thẻ tương ứng nếu chúng khớp
            for (const [label, keywords] of Object.entries(components)) {
              if (keywords.some(keyword => title.includes(keyword) || body.includes(keyword))) {
                labels.push(label);
              }
            }

            // Phát hiện hệ điều hành từ nội dung
            const osKeywords = {
              'windows': ['windows', 'win10', 'win11'],  // Windows hệ thống
              'macos': ['macos', 'mac', 'osx', 'apple silicon', 'm1', 'm2', 'm3'],  // macOS hệ thống
              'linux': ['linux', 'ubuntu', 'debian']  // Linux hệ thống
            };

            // Duyệt qua các từ khóa của hệ điều hành và thêm các thẻ tương ứng nếu chúng khớp
            for (const [os, keywords] of Object.entries(osKeywords)) {
              if (keywords.some(keyword => body.includes(keyword))) {
                labels.push(os);
              }
            }

            // Nếu thẻ được tìm thấy, nó sẽ được áp dụng cho nó issue hoặc PR
            if (labels.length > 0) {
              // Loại bỏ các thẻ trùng lặp
              const uniqueLabels = [...new Set(labels)];

              // Áp dụng thẻ dựa trên loại
              if (isIssue) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels: uniqueLabels
                });
              } else {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: uniqueLabels
                });
              }

              console.log(`Đã thêm nhãn: ${uniqueLabels.join(', ')}`);
            }
