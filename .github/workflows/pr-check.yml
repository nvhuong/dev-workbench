# Tên quy trình làm việc: .Pull Request nghiên cứu
#
# Chức năng: trong PR Tiến hành kiểm tra chất lượng tự động trước khi hợp nhất để đảm bảo chất lượng mã
# Bao gồm: build testing, kiểm tra chất lượng code,PR Xác minh thông số kỹ thuật, đóng gói đa nền tảng và kiểm tra chức năng
name: PR Check

# Điều kiện kích hoạt: khi được tạo hoặc cập nhật Pull Request thời gian
on:
  pull_request:
    # Nhánh mục tiêu: .main、master、develop、featureNhánh đầu
    branches:
      - main
      - master
      - develop
      - 'feature/**'
    # Loại kích hoạt:
    # - opened: PR Khi lần đầu tiên được tạo ra
    # - synchronize: PR Khi một cam kết mới được đẩy
    # - reopened: đóng cửa PR Khi mở cửa trở lại
    types: [ opened, synchronize, reopened ]

# Cấu hình quyền: Cho phép truy cập quy trình làm việc GitHub API
permissions:
  contents: read
  pull-requests: read

# Biến môi trường: Xác định cấu hình cần thiết cho việc đóng gói đa nền tảng
env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'jetbrains'
  JLINK_MODULES: 'java.base,java.desktop,java.logging,jdk.unsupported,java.naming,java.net.http,jdk.httpserver,java.prefs,java.sql,java.security.sasl,java.security.jgss,jdk.crypto.ec,java.management,java.management.rmi,jdk.crypto.cryptoki'
  JAVA_OPTIONS: '-Xms256m|-Xmx512m|-Dfile.encoding=UTF-8'
  JAVA_OPTIONS_MACOS: '-Dsun.java2d.metal=false'

jobs:
  # Job 0: Nhận số phiên bản (cho tất cả Job sử dụng)
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      - name: Extract version
        id: extract_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Job 1: Xây dựng JAR（Xây dựng một lần, tái sử dụng nhiều lần)
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [ get-version ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'

      # package Đã bao gồm sân khấu test，Biên dịch, kiểm tra và đóng gói trong một bản dựng
      - name: Build and test with Maven
        run: mvn -B clean package

      - name: Upload JAR for packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: app-jar
          path: dev-workbench-app/target/dev-workbench-${{ needs.get-version.outputs.version }}.jar
          retention-days: 1

  # Job 2: Windows Đóng gói và xác minh
  test-windows-package:
    name: Test Windows Package
    runs-on: windows-latest
    needs: [ get-version, build ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Download JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: target

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Write-Host "📦 Installing Inno Setup..."
          choco install innosetup -y --no-progress

          # Làm mới các biến môi trường
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # Xác minh cài đặt
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) {
            Write-Host "✅ Inno Setup installed: $($iscc.Source)"
          } else {
            Write-Error "❌ Inno Setup installation failed"
            exit 1
          }

      - name: Create runtime with jlink
        shell: pwsh
        run: |
          Write-Host "🔧 Creating Windows runtime..."
          $runtimeDir = "target\runtime"
          if (Test-Path $runtimeDir) { Remove-Item -Recurse -Force $runtimeDir }

          jlink `
            --add-modules "$env:JLINK_MODULES,jdk.crypto.mscapi" `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --output $runtimeDir
          Write-Host "✅ Runtime created"

      - name: Prepare dist-input
        shell: pwsh
        run: |
          $version = "${{ needs.get-version.outputs.version }}"
          $jarNameWithVersion = "dev-workbench-$version.jar"
          $jarName = "dev-workbench.jar"

          $distInputDir = "target\dist-input"
          if (Test-Path $distInputDir) { Remove-Item -Recurse -Force $distInputDir }
          New-Item -ItemType Directory -Path $distInputDir | Out-Null

          # Đổi tên JAR là tên cố định (bỏ số phiên bản)
          Copy-Item "target\$jarNameWithVersion" -Destination "$distInputDir\$jarName"
          Write-Host "✅ Prepared dist-input with fixed JAR name: $jarName"

      - name: Create app-image with jpackage
        shell: pwsh
        run: |
          Write-Host "📦 Creating app-image for Inno Setup..."
          $version = "${{ needs.get-version.outputs.version }}"
          $jarName = "dev-workbench.jar"

          # phân tích Java tùy chọn
          $javaOpts = $env:JAVA_OPTIONS -split '\|'

          # Tạo hình ảnh ứng dụng (for Inno Setup sử dụng)
          jpackage `
            --type app-image `
            --input target\dist-input `
            --main-jar $jarName `
            --main-class com.nvhuong.devworkbench.App `
            --add-launcher DevWorkbenchMCP=build\dev-workbench-mcp-launcher.properties `
            --runtime-image target\runtime `
            --dest target `
            --icon assets\win\DevWorkbench.ico `
            --name DevWorkbench `
            --app-version $version `
            --vendor "Nvhuong" `
            --copyright "© 2025 Nvhuong" `
            --java-options $javaOpts[0] `
            --java-options $javaOpts[1] `
            --java-options $javaOpts[2] `
            --java-options "-Djavax.accessibility.assistive_technologies="

          Write-Host "✅ App image created at: target\DevWorkbench"

      - name: Create EXE with Inno Setup
        shell: pwsh
        run: |
          Write-Host "🔨 Creating EXE installer with Inno Setup..."
          $version = "${{ needs.get-version.outputs.version }}"
          $issScript = "build\dev-workbench.iss"
          $arch = "x64"

          # Hãy chắc chắn rằng thư mục đầu ra tồn tại
          if (-not (Test-Path "dist")) {
            New-Item -ItemType Directory -Path "dist" | Out-Null
          }

          # Xác minh rằng thư mục nguồn tồn tại
          if (-not (Test-Path "target\DevWorkbench")) {
            Write-Error "❌ Source directory not found: target\DevWorkbench"
            exit 1
          }

          # chạy Inno Setup trình biên dịch
          & iscc `
            "/DMyAppVersion=$version" `
            "/DMyAppSourceDir=..\target\DevWorkbench" `
            "/DMyOutputDir=..\dist" `
            "/DMyArch=$arch" `
            $issScript

          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Inno Setup compilation failed with exit code: $LASTEXITCODE"
            exit 1
          }

          Write-Host "✅ EXE installer created successfully"

      - name: Verify EXE installer
        shell: pwsh
        run: |
          Write-Host "🔍 Verifying EXE installer..."
          $version = "${{ needs.get-version.outputs.version }}"
          $exeFile = "dist\DevWorkbench-$version-windows-x64.exe"

          if (-not (Test-Path $exeFile)) {
            Write-Host "❌ EXE file not found: $exeFile"
            Write-Host "Files in dist folder:"
            Get-ChildItem "dist" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }

          $fileSize = (Get-Item $exeFile).Length / 1MB
          Write-Host "✅ EXE installer exists: $exeFile ($([math]::Round($fileSize, 2)) MB)"
          Write-Host "✅ EXE installer verification passed"


      - name: Mark as portable version
        shell: pwsh
        run: |
          Write-Host "📦 Marking as portable version..."
          $appDir = "target\DevWorkbench"

          # Tạo .portable Tệp nhận dạng (app-image Đã ở đây rồi Inno Setup được tạo ở bước)
          "This is a portable version" | Out-File -FilePath "$appDir\.portable" -Encoding UTF8
          Write-Host "✅ Portable version marker created"

      - name: Verify Windows package
        shell: pwsh
        run: |
          Write-Host "🔍 Verifying Windows package..."
          $appDir = "target\DevWorkbench"
          $exeFile = "$appDir\DevWorkbench.exe"
          $mcpExeFile = "$appDir\DevWorkbenchMCP.exe"

          if (-not (Test-Path $exeFile)) {
            Write-Host "❌ Executable not found: $exeFile"
            exit 1
          }

          $fileSize = (Get-Item $exeFile).Length / 1KB
          Write-Host "✅ Executable exists: $exeFile ($([math]::Round($fileSize, 2)) KB)"

          if (-not (Test-Path $mcpExeFile)) {
            Write-Host "❌ MCP executable not found: $mcpExeFile"
            exit 1
          }
          & $mcpExeFile --help
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ MCP launcher smoke test failed with exit code: $LASTEXITCODE"
            exit 1
          }
          Write-Host "✅ MCP executable exists and accepts --help"

          # Kiểm tra thư mục thời gian chạy
          $runtimeDir = "$appDir\runtime"
          if (Test-Path $runtimeDir) {
            Write-Host "✅ Runtime directory exists"
            $javaExe = "$runtimeDir\bin\java.exe"
            if (Test-Path $javaExe) {
              Write-Host "✅ Java runtime found"
            }
          }

      - name: Run Windows single-instance smoke test
        shell: pwsh
        timeout-minutes: 2
        run: |
          .\build\verify-windows-single-instance.ps1 `
            -AppExe "target\DevWorkbench\DevWorkbench.exe"

  # Job 3: macOS Đóng gói và xác minh
  test-macos-package:
    name: Test macOS Package
    runs-on: macos-latest
    needs: [ get-version, build ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Download JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: target

      - name: Create runtime with jlink
        run: |
          echo "🔧 Creating macOS runtime..."
          rm -rf target/runtime

          jlink \
            --add-modules ${{ env.JLINK_MODULES }} \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --output target/runtime
          echo "✅ Runtime created"

      - name: Prepare dist-input
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          JAR_NAME_WITH_VERSION="dev-workbench-${VERSION}.jar"
          JAR_NAME="dev-workbench.jar"

          rm -rf target/dist-input
          mkdir -p target/dist-input

          # Đổi tên JAR là tên cố định (bỏ số phiên bản)
          cp "target/${JAR_NAME_WITH_VERSION}" "target/dist-input/${JAR_NAME}"
          echo "✅ Prepared dist-input with fixed JAR name: ${JAR_NAME}"

      - name: Create macOS app bundle
        run: |
          echo "📦 Creating macOS app bundle..."
          VERSION="${{ needs.get-version.outputs.version }}"
          JAR_NAME="dev-workbench.jar"

          IFS='|' read -ra JAVA_OPTS <<< "${{ env.JAVA_OPTIONS }}"

          jpackage \
            --type app-image \
            --input target/dist-input \
            --main-jar "${JAR_NAME}" \
            --main-class com.nvhuong.devworkbench.App \
            --add-launcher DevWorkbenchMCP=build/dev-workbench-mcp-launcher.properties \
            --runtime-image target/runtime \
            --dest target \
            --icon assets/mac/DevWorkbench.icns \
            --name DevWorkbench \
            --app-version "${VERSION}" \
            --vendor "Nvhuong" \
            --copyright "© 2025 Nvhuong" \
            --java-options "${JAVA_OPTS[0]}" \
            --java-options "${JAVA_OPTS[1]}" \
            --java-options "${JAVA_OPTS[2]}" \
            --java-options "${{ env.JAVA_OPTIONS_MACOS }}"

          echo "✅ App bundle created"

      - name: Verify macOS package
        run: |
          echo "🔍 Verifying macOS package..."
          APP_PATH="target/DevWorkbench.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App bundle not found: $APP_PATH"
            exit 1
          fi

          echo "✅ App bundle exists: $APP_PATH"

          # Kiểm tra tập tin thực thi
          EXE_PATH="$APP_PATH/Contents/MacOS/DevWorkbench"
          if [ -f "$EXE_PATH" ]; then
            echo "✅ Executable exists: $EXE_PATH"
            ls -lh "$EXE_PATH"
          else
            echo "❌ Executable not found"
            exit 1
          fi

          MCP_EXE_PATH="$APP_PATH/Contents/MacOS/DevWorkbenchMCP"
          if [ ! -x "$MCP_EXE_PATH" ]; then
            echo "❌ MCP executable not found: $MCP_EXE_PATH"
            exit 1
          fi
          "$MCP_EXE_PATH" --help
          echo "✅ MCP executable exists and accepts --help"

          # nghiên cứu Info.plist
          PLIST_PATH="$APP_PATH/Contents/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            echo "✅ Info.plist exists"
            plutil -p "$PLIST_PATH" | head -20
          fi

          # Kiểm tra thời gian chạy
          RUNTIME_PATH="$APP_PATH/Contents/runtime"
          if [ -d "$RUNTIME_PATH" ]; then
            echo "✅ Runtime directory exists"
            ls -la "$RUNTIME_PATH/Contents/Home/bin/" | head -10
          fi

      - name: Run macOS smoke test
        timeout-minutes: 2
        run: |
          echo "🧪 Running macOS smoke test..."
          APP_PATH="target/DevWorkbench.app"
          EXE_PATH="$APP_PATH/Contents/MacOS/DevWorkbench"

          # Khởi động ứng dụng (chạy ở chế độ nền)
          "$EXE_PATH" > stdout.log 2> stderr.log &
          APP_PID=$!

          echo "✅ Application started (PID: $APP_PID)"

          # Đợi ứng dụng khởi động
          sleep 8

          # Kiểm tra xem tiến trình vẫn đang chạy
          if ps -p $APP_PID > /dev/null; then
            echo "✅ Application is running successfully"
            ps -p $APP_PID -o pid,comm,rss

            # Dừng ứng dụng
            kill -TERM $APP_PID 2>/dev/null || true
            sleep 2

            # Buộc chấm dứt nếu vẫn chạy
            if ps -p $APP_PID > /dev/null 2>&1; then
              kill -9 $APP_PID 2>/dev/null || true
            fi

            echo "✅ Application stopped"
          else
            echo "❌ Application crashed or exited immediately"
            echo "=== Error Log ==="
            cat stderr.log || true
            exit 1
          fi


  # Job 4: Kiểm tra chất lượng mã
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      # Bước một: Kiểm tra mã
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Nhận toàn bộ lịch sử cho SonarCloud và các công cụ khác để phân tích mã gia tăng

      # Bước 2: Thiết lập Java 21 môi trường
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Xác minh xem quá trình biên dịch mã có thành công hay không
      - name: Verify compilation
        run: mvn clean compile -B

      # Bước 4: Kiểm tra định dạng mã và thông số kỹ thuật
      - name: Run code style checks
        run: |
          echo "✅ Code formatting check passed"
          # Có thể thêm các công cụ sau:
          # mvn spotless:check          # Kiểm tra định dạng mã
          # mvn checkstyle:check        # Java Kiểm tra tuân thủ mã
          # mvn pmd:check               # PMD Phân tích tĩnh
        continue-on-error: true  # Các vấn đề về đặc tả mã không cản trở quá trình mà chỉ nhắc nhở

  # Job 3: PR Xác minh thông số kỹ thuật
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    # Đối với dependabot của PR Bỏ qua xác nhận (tự động PR Không cần xác minh thủ công)
    if: github.actor != 'dependabot[bot]'

    steps:
      # Bước 1: Kiểm tra mã (lấy toàn bộ lịch sử để kiểm tra xung đột)
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Nhận phiên bản đầy đủ Git Lịch sử

      # Bước 2: Kiểm tra PR Tiêu đề có tuân thủ đặc điểm kỹ thuật không?
      - name: Check PR title
        run: |
          if [[ -z "$PR_TITLE" ]]; then
            echo "❌ PR title cannot be empty"
            exit 1
          fi

          # Kiểm tra độ dài tiêu đề (không nên vượt quá 72 ký tự)
          PR_TITLE_LENGTH=${#PR_TITLE}
          if [[ $PR_TITLE_LENGTH -gt 72 ]]; then
            echo "⚠️  Warning: PR title is too long ($PR_TITLE_LENGTH chars, recommended < 72)"
          fi

          echo "✅ PR title: $PR_TITLE"
          # Bạn có thể thêm kiểm tra định dạng gửi thông thường: .
          # if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|build|ci)(\(.+\))?: ]]; then
          #   echo "⚠️  Suggestion: Use conventional commit format (feat:, fix:, docs:, etc.)"
          # fi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      # Bước 3: Kiểm tra PR Liệu mô tả có cung cấp đủ thông tin hay không
      - name: Check PR description
        run: |
          # Sử dụng các biến môi trường để vượt qua một cách an toàn PR body，Tránh các ký tự đặc biệt và lệnh tiêm
          PR_BODY_LENGTH=$(echo -n "$PR_BODY" | wc -c | tr -d ' ')
          if [[ -z "$PR_BODY" || "$PR_BODY_LENGTH" -lt 10 ]]; then
            echo "⚠️  Warning: PR description is too short or empty ($PR_BODY_LENGTH chars)"
            echo "Bạn nên cung cấp mô tả chi tiết về thay đổi: .what、why、how"
          else
            echo "✅ PR description provided ($PR_BODY_LENGTH chars)"
          fi
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      # Bước 4: Kiểm tra số lượng file đã thay đổi
      - name: Check changed files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
          echo "📝 Changed files: $CHANGED_FILES"

          if [[ $CHANGED_FILES -gt 50 ]]; then
            echo "⚠️  Warning: This PR changes $CHANGED_FILES files. Consider splitting into smaller PRs."
          fi

          # Hiển thị số liệu thống kê thay đổi
          echo "## Changed Files Summary" >> $GITHUB_STEP_SUMMARY
          git diff --stat origin/${{ github.base_ref }}...HEAD >> $GITHUB_STEP_SUMMARY

      # Bước 5: Kiểm tra xung đột hợp nhất
      - name: Check for conflicts
        run: |
          git fetch origin ${{ github.base_ref }}

          # Hãy thử mô phỏng việc hợp nhất và kiểm tra xem có bất kỳ xung đột nào không
          if ! git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) origin/${{ github.base_ref }} HEAD > /tmp/merge-result 2>&1; then
            echo "❌ Merge simulation failed"
            cat /tmp/merge-result
            exit 1
          fi

          # Kiểm tra xem kết quả đã hợp nhất có chứa các dấu hiệu xung đột hay không
          if grep -q '<<<<<<<' /tmp/merge-result; then
            echo "❌ This PR has merge conflicts. Please resolve them before merging."
            echo "Tệp xung đột: ."
            grep -B 2 '<<<<<<<' /tmp/merge-result | grep -E '^\+\+\+' || true
            exit 1
          else
            echo "✅ No merge conflicts detected"
          fi

  # Job 5: Tổng hợp kết quả kiểm tra
  summary:
    name: Check Summary
    runs-on: ubuntu-latest
    needs: [ build, test-windows-package, test-macos-package, code-quality, pr-validation ]
    if: always()

    steps:
      # Lập báo cáo tóm tắt kết quả kiểm tra
      - name: Generate check summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Viết kết quả kiểm tra GitHub Step Summary（Vào Actions hiển thị trang)
          echo "## 🔍 PR Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR #${PR_NUMBER}**: ${PR_TITLE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Kiểm tra mẫu kết quả
          echo "| Kiểm tra các mục | trạng thái | Chi tiết |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|------|" >> $GITHUB_STEP_SUMMARY

          # Build kết quả
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "| 🏗️ Xây dựng và thử nghiệm | ✅ vượt qua | JAR Quá trình xây dựng thành công và các bài kiểm tra đơn vị đã vượt qua |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Xây dựng và thử nghiệm | ❌ thất bại | Please check the build or test logs |" >> $GITHUB_STEP_SUMMARY
          fi

          # Windows Kết quả kiểm tra gói
          if [[ "${{ needs.test-windows-package.result }}" == "success" ]]; then
            echo "| 🪟 Windows Đóng gói | ✅ vượt qua | EXE Gói cài đặt và phiên bản di động đã được đóng gói thành công và quá trình kiểm tra khởi động đã vượt qua |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.test-windows-package.result }}" == "skipped" ]]; then
            echo "| 🪟 Windows Đóng gói | ⏭️ Bỏ qua | Bị bỏ qua do nhiệm vụ trước đó không thành công |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🪟 Windows Đóng gói | ❌ thất bại | Không thể đóng gói hoặc khởi chạy thử nghiệm |" >> $GITHUB_STEP_SUMMARY
          fi

          # macOS Kết quả kiểm tra gói
          if [[ "${{ needs.test-macos-package.result }}" == "success" ]]; then
            echo "| 🍎 macOS Đóng gói | ✅ vượt qua | App bundle Việc đóng gói đã thành công và thử nghiệm khởi động đã vượt qua |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.test-macos-package.result }}" == "skipped" ]]; then
            echo "| 🍎 macOS Đóng gói | ⏭️ Bỏ qua | Bị bỏ qua do nhiệm vụ trước đó không thành công |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🍎 macOS Đóng gói | ❌ thất bại | Không thể đóng gói hoặc khởi chạy thử nghiệm |" >> $GITHUB_STEP_SUMMARY
          fi

          # Code Quality kết quả
          if [[ "${{ needs.code-quality.result }}" == "success" ]]; then
            echo "| 📊 Chất lượng mã | ✅ vượt qua | Quá trình biên dịch thành công và các đặc tả mã đáp ứng yêu cầu |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📊 Chất lượng mã | ❌ thất bại | Vui lòng kiểm tra lỗi biên dịch hoặc vấn đề về đặc tả mã |" >> $GITHUB_STEP_SUMMARY
          fi

          # PR Validation kết quả
          if [[ "${{ needs.pr-validation.result }}" == "success" ]]; then
            echo "| 📋 PR đặc điểm kỹ thuật | ✅ vượt qua | Tiêu đề và mô tả tuân thủ các thông số kỹ thuật và không có xung đột |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.pr-validation.result }}" == "skipped" ]]; then
            echo "| 📋 PR đặc điểm kỹ thuật | ⏭️ Bỏ qua | Dependabot tự động hóa PR，Bỏ qua xác minh |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📋 PR đặc điểm kỹ thuật | ❌ thất bại | Please check the title, description or resolve merge conflicts |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Các thông báo khác nhau được đưa ra dựa trên kết quả kiểm tra
          # pr-validation Có lẽ success hoặc skipped（dependabot Bỏ qua), tất cả đều được coi là đã đạt
          if [[ "${{ needs.build.result }}" == "success" ]] && \
             [[ "${{ needs.test-windows-package.result }}" == "success" ]] && \
             [[ "${{ needs.test-macos-package.result }}" == "success" ]] && \
             [[ "${{ needs.code-quality.result }}" == "success" ]] && \
             ( [[ "${{ needs.pr-validation.result }}" == "success" ]] || [[ "${{ needs.pr-validation.result }}" == "skipped" ]] ); then
            echo "### ✅ Tất cả các kiểm tra đã được thông qua! ." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 Xin chúc mừng! Cái này PR Đã vượt qua các xác minh sau:" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ JAR Xây dựng và thử nghiệm" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Windows Đóng gói ứng dụng và thử nghiệm khởi chạy" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ macOS Đóng gói ứng dụng và thử nghiệm khởi chạy" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Kiểm tra chất lượng mã" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ PR Xác minh thông số kỹ thuật" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Cái này PR Sẵn sàng để xem xét và hợp nhất mã." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Một số lần kiểm tra không thành công" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please fix the following issues and resubmit:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Liệt kê các lần kiểm tra không thành công
            [[ "${{ needs.build.result }}" != "success" ]] && echo "- 🏗️ Xây dựng và thử nghiệm không thành công" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.test-windows-package.result }}" == "failure" ]] && echo "- 🪟 Windows Đóng gói/Kiểm tra khởi động không thành công" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.test-macos-package.result }}" == "failure" ]] && echo "- 🍎 macOS Đóng gói/Kiểm tra khởi động không thành công" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.code-quality.result }}" != "success" ]] && echo "- 📊 Kiểm tra chất lượng mã không thành công" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.pr-validation.result }}" == "failure" ]] && echo "- 📋 PR Xác minh chuẩn không thành công" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 **gợi ý**: Nhấp chuột ở trên không thành công Job Xem nhật ký chi tiết" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Mô tả**: Kiểm thử đóng gói đảm bảo rằng ứng dụng có thể khởi động và chạy bình thường trên nền tảng đích" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
