# Tên quy trình làm việc: .CodeQL Phân tích bảo mật mã
# CodeQL Nó là gì? .
# - GitHub Công cụ quét bảo mật mã để tự động phát hiện các lỗ hổng bảo mật và lỗi mã hóa trong mã của bạn
# - Hỗ trợ nhiều ngôn ngữ lập trình (Java、JavaScript、Python、C/C++Chờ đợi)
# - Có thể tìm thấy tại:SQL tiêm,XSS、Các vấn đề bảo mật như truyền tải đường dẫn và quá trình khử lưu lượng không an toàn
name: "CodeQL"

# Điều kiện kích hoạt
on:
  # Khi mã được đẩy tới master Được kích hoạt khi phân nhánh (để phát hiện các vấn đề bảo mật trong mã mới)
  push:
    branches: [ master ]
  # Khi tạo mục tiêu master Phân nhánh PR Được kích hoạt khi (vấn đề bảo mật được phát hiện trước khi hợp nhất)
  pull_request:
    branches: [ master ]
  # Lịch quét: Chủ Nhật hàng tuần UTC 02:00（Giờ Bắc Kinh 10:00）Chạy một lần
  # Vai trò: Có thể phát hiện các mẫu lỗ hổng bảo mật mới được phát hiện ngay cả khi mã không thay đổi
  schedule:
    - cron: '0 2 * * 0'

# Cài đặt quyền: Cho phép viết câu hỏi bảo mật GitHub Security trang tab
permissions:
  security-events: write
  # Thêm vào actions Quyền đọc (bắt buộc đối với một số môi trường)
  actions: read
  # Thêm quyền đọc nội dung
  contents: read

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest

    # Cài đặt thời gian chờ: Tránh các tác vụ phân tích chạy quá lâu
    timeout-minutes: 360

    steps:
      # Bước một: Kiểm tra kho lưu trữ mã
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Bước 2: Khởi tạo CodeQL Phân tích môi trường
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          # Chỉ định ngôn ngữ lập trình để phân tích
          languages: java
          # Cấp độ truy vấn:security-extended（gợi ý)
          # - default: Kiểm tra an ninh cơ bản
          # - security-extended: Kiểm tra bảo mật mở rộng (được khuyến nghị, bao gồm nhiều vấn đề bảo mật hơn)
          # - security-and-quality: An toàn+Kiểm tra chất lượng mã (toàn diện nhất nhưng dài hơn)
          queries: security-extended

      # Bước 3: Tự động xây dựng dự án (CodeQL Mã biên dịch là cần thiết để phân tích)
      # Đối với Java/Maven Dự án sẽ được thực hiện tự động mvn compile
      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

      # Bước 4: Thực hiện CodeQL Phân tích bảo mật
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          # Mã định danh danh mục phân tích (được sử dụng trong  Security để phân biệt giữa các kiểu quét khác nhau)
          category: "security"
          # Tải kết quả lên GitHub Security trang tab
          # Nó có thể ở trong kho Security -> Code scanning alerts Kiểm tra các vấn đề được tìm thấy
